name: Architecture decision (ADR)
description: Propose or discuss a decision that needs an ADR
labels: [adr]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision and consequences
    validations:
      required: true
