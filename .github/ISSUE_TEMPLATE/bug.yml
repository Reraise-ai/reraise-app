name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version, OS, Node version
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: This report contains no real personal data or secrets.
          required: true
