name: Feature request
description: Propose a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would an automated test prove it works?
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: This issue contains no real personal data or secrets.
          required: true
