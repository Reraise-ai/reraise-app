name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# validate:schemas compiles every JSON Schema in Ajv strict mode, validates every example
# and valid fixture, and requires every invalid fixture to fail with its declared error.
# lint:openapi lints the Board API with Redocly; the MCP/OpenAPI parity test and the adapter
# conformance kit (against the in-memory fake) run inside the test suite. The e2e job runs the M1
# walking skeleton and the axe check (Playwright, Chromium) on all three operating systems; the
# browser is installed in the e2e job (locally: run `pnpm --filter @worldbuilder/e2e exec
# playwright install chromium` once, or point PLAYWRIGHT_BROWSERS_PATH to an existing Chromium).
# Nothing here is a placeholder that passes without checking something.

jobs:
  lint-format:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - name: OpenAPI lint (Redocly)
        run: pnpm lint:openapi
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Generated types match the JSON Schemas
        run: pnpm check:generated
  checks:
    name: Tests and checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm check:spdx
      - name: Board uses design tokens only (ADR-0019)
        run: pnpm check:board-tokens
      - name: Apache-2.0 packages never import AGPL packages
        run: pnpm check:licence-imports
      - run: pnpm check:no-real-data
      - run: pnpm validate:schemas
      - run: pnpm build

  e2e:
    name: End-to-end walking skeleton and axe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # From the e2e directory so npx runs the pinned @playwright/test, not the latest release.
      - name: Install Chromium for the pinned Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Build and run the e2e (pnpm test:e2e)
        run: pnpm test:e2e
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  hermes:
    name: Hermes integration (fake Hermes harness, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e "integrations/hermes[test]"
      - name: Lint the Python of the integration (ruff)
        run: ruff check integrations/hermes && ruff format --check integrations/hermes
      - run: pnpm test:hermes

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking on purpose: a high or critical advisory in the dependency tree fails CI.
    # If an advisory has no fix yet, document the exception in the PR rather than
    # loosening this job.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pipx run reuse==6.2.0 lint

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      # sha256 of gitleaks_8.28.0_linux_x64.tar.gz from the official release checksums
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks CLI
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --no-banner --redact --verbose
