name: Release

# A tag v<version> builds the toolkit zip (scripts/pack-toolkit.mjs), runs the newcomer path on
# the unpacked zip (scripts/smoke-toolkit.mjs) and attaches reraise-toolkit-<version>.zip to the
# GitHub release of that tag (created if it does not exist yet).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  toolkit:
    name: Toolkit zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Pack
        run: node scripts/pack-toolkit.mjs --version "${GITHUB_REF_NAME#v}"
      - name: Start the unpacked zip on a new store
        run: node scripts/smoke-toolkit.mjs "dist/reraise-toolkit-${GITHUB_REF_NAME#v}.zip"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" "dist/reraise-toolkit-${GITHUB_REF_NAME#v}.zip" --clobber
