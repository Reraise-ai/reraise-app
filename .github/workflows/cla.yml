name: CLA

# Sets the commit status `CLA` on pull requests that touch an AGPL-3.0-or-later directory, and
# runs the job `DCO` on every pull request (ADR-0052). Both triggers run this file and the
# scripts from the default branch, never code from the pull request: `pull_request_target` and
# `issue_comment` always use the default branch's workflow, checkout without `ref` gives the
# base branch, and there is no `pnpm install`. So a pull request cannot change either check.
# Event data reaches the scripts only through GITHUB_EVENT_PATH. No path filter here: the script
# decides, so a required status never waits for a run that did not start.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

# One group per pull request. `queue: max` keeps every waiting run (up to 100) instead of
# cancelling it in favour of a newer one, so no signing comment is dropped. Each run also
# records all signing comments of the pull request, which heals a run that was lost anyway.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  cla:
    name: CLA status
    # contains() ignores case; the script checks the exact sentence.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'Reraise Individual CLA') ||
      contains(github.event.comment.body, 'recheck')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the token can write the whole repository; the script writes only cla-signatures
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/cla-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every commit needs a `Signed-off-by:` line with the e-mail of its author or committer
  # (ADR-0004, ADR-0052). Merge commits and Dependabot are exempt. Old history is not checked.
  dco:
    name: DCO
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/dco-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
