name: DCO

# Every commit of a pull request needs a `Signed-off-by:` line with the e-mail of its author or
# committer (ADR-0004, ADR-0052). Merge commits and Dependabot are exempt. Old history is not
# checked.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/dco-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
