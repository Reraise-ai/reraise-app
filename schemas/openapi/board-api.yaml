openapi: 3.1.0
info:
  title: The Worldbuilder Board API
  version: 0.0.0
  summary: HTTP contract of the board, mirroring the MCP tools plus human-only operations.
  description: |
    Contract-first HTTP API of The Worldbuilder (ADR-0016). Every operation that mirrors an
    MCP tool has the tool's name as `operationId` and uses the same JSON Schemas for input and
    output; a parity test enforces this. Operations marked `x-human-only: true` accept only the
    human session token: agent tokens are rejected with 403 (ADR-0011, ADR-0026). Stances are
    reachable only through the human-only stance operations, for the local screen.

    The server binds to loopback by default. Every response passes the disclosure gate for the
    caller's registered target; denied cards are omitted (ADR-0012). The disclosure target and
    the agent identity come from the credential, never from a request body.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:4310
    description: Default local binding (loopback only).
security:
  - sessionToken: []
  - agentToken: []
tags:
  - name: world
    description: Read the active world. Mirrors MCP tools.
  - name: proposals
    description: Agent proposals; proposal_create is the only agent write path.
  - name: knowledge
    description: >-
      The knowledge loop (ADR-0039): consult with a receipt, write back with a receipt, propose
      decisions and outcomes, route agent memories. Mirrors MCP tools.
  - name: human-only
    description: Operations only the human session may call.
paths:
  /worlds:
    get:
      operationId: world_list
      summary: List worlds
      tags: [world]
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The worlds of the store.
          content:
            application/json:
              schema:
                $ref: '../api.schema.json#/$defs/worldList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /lagen:
    post:
      operationId: lage_create
      summary: Create a Lage
      description: >-
        Human-only. Creates a new Lage card with its first board state and returns it with the
        id assigned by the store (ADR-0023).
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../api.schema.json#/$defs/lageCreateRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The new Lage card.
          content:
            application/json:
              schema:
                $ref: '../card.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '413':
          $ref: '#/components/responses/TooLarge'

  /lagen/{lageId}:
    parameters:
      - name: lageId
        in: path
        required: true
        schema:
          $ref: '../api.schema.json#/$defs/lageGetRequest/properties/lageId'
    get:
      operationId: lage_get
      summary: Get a Lage (a card of type lage with its board state)
      tags: [world]
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The Lage card.
          content:
            application/json:
              schema:
                $ref: '../card.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: lage_save
      summary: Save a new version of a Lage's board state
      description: >-
        Human-only. The body's `version` must be the stored version plus one (optimistic
        concurrency); the previous version is archived, nothing is deleted (ADR-0006).
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../lage.schema.json'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The saved Lage card.
          content:
            application/json:
              schema:
                $ref: '../card.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'

  /lagen/{lageId}/level1:
    parameters:
      - name: lageId
        in: path
        required: true
        schema:
          $ref: '../api.schema.json#/$defs/level1GetRequest/properties/lageId'
    get:
      operationId: level1_get
      summary: Level 1 on a Lage, the engines and the latest estimate
      description: >-
        Human-only. Lists the engines on offer (the built-in local engine, configured cloud
        engines, and presets that are listed but not configured) and the latest prediction kept
        in memory for this Lage, with `stale: true` when the board changed since it was made
        (ADR-0035). `explain=true` adds the basis of the local engine for the current board.
        The prediction is an attributed estimate, not a card, and is never written to a store.
        No side effects.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      parameters:
        - name: explain
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/level1GetRequest/properties/explain'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The Level 1 state of the Lage.
          content:
            application/json:
              schema:
                $ref: '../api.schema.json#/$defs/level1State'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: level1_predict
      summary: Estimate each player's next move
      description: >-
        Human-only, and not an MCP tool (ADR-0035, ADR-0011: a prediction is the human's own
        request). Builds the request from the cards on the Lage (actor cards are the players,
        the user's rule cards that apply to it are added), each cleared by the disclosure gate,
        never a stance or a pending proposal; an assumption card the user rejected is left out.
        The built-in `local` engine runs in this process and is cleared as the screen. A cloud
        engine follows the transfer flow of ADR-0031: the first call (no `transferId`) answers
        `confirmation_required` with the previewed envelope and sends nothing; after
        `disclosure_confirm` the call is repeated with the `transferId` and the single-use
        `confirmationToken` and the engine receives exactly the confirmed objects; any change
        of the board or the question since the preview is a 409 and needs a new preview. A late
        answer for a board that has changed is dropped (`superseded`). The latest prediction
        per Lage is kept in memory only.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../api.schema.json#/$defs/level1PredictRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The result of the call.
          content:
            application/json:
              schema:
                $ref: '../api.schema.json#/$defs/level1Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'

  /lagen/{lageId}/level1/escalate:
    parameters:
      - name: lageId
        in: path
        required: true
        schema:
          $ref: '../api.schema.json#/$defs/level1GetRequest/properties/lageId'
    post:
      operationId: level1_escalate
      summary: Open a level-2 board analysis for one player
      description: >-
        Human-only, and not an MCP tool. Creates a new Lage card from the latest prediction of
        this Lage for one player (ADR-0035): the question asks for that player's next move, the
        options are the move options, the cards the engine used are placed, the user is the only
        seat, and the new card has a `based_on` edge to the source Lage. Nothing of the
        prediction (move, confidence) is copied. 409 when there is no prediction or it is stale.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../api.schema.json#/$defs/level1EscalateRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The new Lage card.
          content:
            application/json:
              schema:
                $ref: '../card.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'

  /cards:
    get:
      operationId: cards_search
      summary: Search cards
      tags: [world]
      parameters:
        - name: worldId
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/cardsSearchRequest/properties/worldId'
        - name: text
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/cardsSearchRequest/properties/text'
        - name: type
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/cardsSearchRequest/properties/type'
        - name: layer
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/cardsSearchRequest/properties/layer'
        - name: limit
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/cardsSearchRequest/properties/limit'
        - name: cursor
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/cardsSearchRequest/properties/cursor'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Gate-cleared matching cards.
          content:
            application/json:
              schema:
                $ref: '../api.schema.json#/$defs/cardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cards/{cardId}:
    get:
      operationId: card_get
      summary: Get one card
      tags: [world]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            $ref: '../api.schema.json#/$defs/cardGetRequest/properties/cardId'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The card, if the gate allows it for the caller.
          content:
            application/json:
              schema:
                $ref: '../card.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/stance:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '../common.schema.json#/$defs/cardId'
    get:
      operationId: stance_get
      summary: Get the user's own stance on a card
      description: >-
        Human-only, for the local screen. Stances never leave the device and never reach a
        model or agent (ADR-0008, ADR-0012).
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The stance with its history.
          content:
            application/json:
              schema:
                $ref: '../stance.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: stance_save
      summary: Set the user's own stance on a card
      description: >-
        Human-only. Stored on the device, never in a card file and never through a
        StorageAdapter. The body is position, weight and note; the server sets `cardId` from
        the path, `updatedAt`, and moves the previous version into `history` (ADR-0008).
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../stance.schema.json#/$defs/input'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The saved stance.
          content:
            application/json:
              schema:
                $ref: '../stance.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'

  /context-packages:
    post:
      operationId: context_package_get
      summary: Build a context package
      description: >-
        Builds a gate-cleared context package for the caller's target. A cloud_model caller gets
        card content only from a confirmed transfer (ADR-0031, ADR-0028). The board sends with
        the transferId and its single-use confirmationToken. An MCP connection registered as
        cloud_model first gets `confirmationRequired` with a transferId and no content; after
        the human confirmed that transfer on the board, it calls again with the transferId and
        the service releases the content to that connection only; the agent never sees a token.
        Without a confirmed transfer the package lists only denied card ids and reasons. Side
        effects: it may create or consume a disclosure transfer, never change the world, so
        the MCP tool keeps `readOnlyHint: true`. 403: the caller's connection is not registered
        with a disclosure target.
      tags: [world]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../context-package.schema.json#/$defs/request'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The context package.
          content:
            application/json:
              schema:
                $ref: '../context-package.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'

  /rules/evaluate:
    post:
      operationId: rules_evaluate
      summary: Evaluate the user's rules on a Lage
      description: >-
        Lists which rules fire and why; never a percentage or recommendation (ADR-0013). No side
        effects.
      tags: [world]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../rule-evaluation.schema.json#/$defs/request'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The rule evaluation for the caller's target.
          content:
            application/json:
              schema:
                $ref: '../rule-evaluation.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'

  /proposals:
    get:
      operationId: proposal_list
      summary: List proposals
      tags: [proposals]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/proposalListRequest/properties/status'
        - name: lageId
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/proposalListRequest/properties/lageId'
        - name: limit
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/proposalListRequest/properties/limit'
        - name: cursor
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/proposalListRequest/properties/cursor'
        - name: changedSince
          in: query
          description: Poll for proposals created or decided after this cursor (ADR-0032).
          schema:
            $ref: '../api.schema.json#/$defs/proposalListRequest/properties/changedSince'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Proposals, newest first.
          content:
            application/json:
              schema:
                $ref: '../api.schema.json#/$defs/proposalPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: proposal_create
      summary: Propose a move (the only agent write path)
      description: >-
        Agent-only: creates a pending proposal. The server sets `id`, `author` (from the agent
        token), `status` and `createdAt`. Nothing proposed counts until a human accepts it
        (ADR-0011). Humans act directly through the human-only operations, so the session token
        gets 403 here.
      tags: [proposals]
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../proposal.schema.json#/$defs/create'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The pending proposal.
          content:
            application/json:
              schema:
                $ref: '../proposal.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
  /proposals/{proposalId}/accept:
    parameters:
      - $ref: '#/components/parameters/proposalId'
    post:
      operationId: proposal_accept
      summary: Accept a proposal
      description: Human-only. Writes the change through the StorageAdapter; authorship stays with the agent.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../proposal.schema.json#/$defs/decide'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The accepted proposal.
          content:
            application/json:
              schema:
                $ref: '../proposal.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'

  /proposals/{proposalId}/reject:
    parameters:
      - $ref: '#/components/parameters/proposalId'
    post:
      operationId: proposal_reject
      summary: Reject a proposal
      description: Human-only.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../proposal.schema.json#/$defs/decide'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The rejected proposal.
          content:
            application/json:
              schema:
                $ref: '../proposal.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'

  /decisions:
    post:
      operationId: decision_create
      summary: Save a new decision card
      description: Human-only. Returns the decision with the id assigned by the store.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../decision.schema.json#/$defs/draft'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The saved decision card.
          content:
            application/json:
              schema:
                $ref: '../decision.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '413':
          $ref: '#/components/responses/TooLarge'

  /decisions/{cardId}:
    put:
      operationId: decision_save
      summary: Save changes to a decision card
      description: Human-only. Written as a patch; store fields the product does not own stay verbatim.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            $ref: '../common.schema.json#/$defs/cardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../decision.schema.json'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The saved decision card.
          content:
            application/json:
              schema:
                $ref: '../decision.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'

  /disclosure/transfers:
    post:
      operationId: disclosure_transfer_preview
      summary: Preview a cloud transfer
      description: >-
        Human-only. Builds the preview envelope (target, connector, request parameters and the
        gate-cleared canonical objects) and its payload hash, an RFC 8785 JCS SHA-256
        (ADR-0031, ADR-0034). Cards the gate does not clear for cloud_model are left out. The
        transfer expires at `expiresAt` and can be confirmed once.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../disclosure-decision.schema.json#/$defs/previewRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The previewed transfer.
          content:
            application/json:
              schema:
                $ref: '../disclosure-decision.schema.json#/$defs/transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '413':
          $ref: '#/components/responses/TooLarge'

  /disclosure/transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/transferId'
    get:
      operationId: disclosure_transfer_get
      summary: Show a pending cloud transfer
      description: Human-only. Lists exactly which cards would be sent (ADR-0012).
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The pending transfer.
          content:
            application/json:
              schema:
                $ref: '../disclosure-decision.schema.json#/$defs/transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
  /disclosure/transfers/{transferId}/confirm:
    parameters:
      - $ref: '#/components/parameters/transferId'
    post:
      operationId: disclosure_confirm
      summary: Confirm one cloud transfer
      description: >-
        Human-only. Confirms exactly the previewed payload: the body carries its `payloadHash`,
        and the service also recomputes the hash of the current envelope. A different hash or a
        second confirmation is rejected with 409, an expired transfer with 410. The response
        issues a single-use confirmation token (at least 128 bits, bound to this human session,
        valid 5 minutes, held in memory only) that the send call carries. There is no standing
        consent (ADR-0012, ADR-0031).
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../disclosure-decision.schema.json#/$defs/confirmRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The confirmation with its single-use token.
          content:
            application/json:
              schema:
                $ref: '../disclosure-decision.schema.json#/$defs/confirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/TooLarge'
  /knowledge/consult:
    post:
      operationId: knowledge_consult
      summary: Consult the knowledge for a task
      description: >-
        Agent-only. Builds the context package exactly like context_package_get (same gate path;
        a cloud_model connection first gets confirmationRequired) and returns it with a
        Knowledge Receipt that is appended to the receipt log (ADR-0039, ADR-0040). The receipt
        holds ids and hashes only; the task text is hashed, never stored. Never changes the
        world, so the MCP tool keeps `readOnlyHint: true`.
      tags: [knowledge]
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../knowledge-receipt.schema.json#/$defs/consultRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The context package and its Knowledge Receipt.
          content:
            application/json:
              schema:
                $ref: '../knowledge-receipt.schema.json#/$defs/consultResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
  /knowledge/write-back:
    post:
      operationId: knowledge_write_back
      summary: Write back what a task learned, or say why not
      description: >-
        Agent-only. Either proposes a card (a pending create_card proposal, never released for
        sharing) or records a coded "not needed" reason; returns a Write-back Receipt that is
        appended to the receipt log (ADR-0039, ADR-0040).
      tags: [knowledge]
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../write-back-receipt.schema.json#/$defs/request'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The Write-back Receipt, and the pending proposal if a card was proposed.
          content:
            application/json:
              schema:
                $ref: '../write-back-receipt.schema.json#/$defs/result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
  /proposals/decision:
    post:
      operationId: decision_record
      summary: Propose a decision card
      description: >-
        Agent-only. Proposes a decision card with the eleven sections as a pending create_card
        proposal; the human accepts or rejects it (ADR-0011, ADR-0017, ADR-0039). Saving a
        decision directly stays human-only (decision_create).
      tags: [knowledge]
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../api.schema.json#/$defs/decisionRecordRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The pending proposal.
          content:
            application/json:
              schema:
                $ref: '../proposal.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
  /proposals/outcome:
    post:
      operationId: decision_outcome
      summary: Propose the outcome of a decision
      description: >-
        Agent-only. Creates a pending record_outcome proposal. On accept the service patches only
        the outcome section, and only if the decision card still has expectedContentHash
        (ADR-0039).
      tags: [knowledge]
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../api.schema.json#/$defs/decisionOutcomeRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: The pending proposal.
          content:
            application/json:
              schema:
                $ref: '../proposal.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
  /memory/route:
    post:
      operationId: memory_route
      summary: Route an agent memory item
      description: >-
        Classifies one memory item as a card proposal or an ephemeral operational fact with the
        deterministic rules of ADR-0042. Stores and logs nothing; creates nothing.
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../memory-route.schema.json#/$defs/request'
      responses:
        '200':
          description: The route, the deciding rule and the signal ids.
          content:
            application/json:
              schema:
                $ref: '../memory-route.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /metrics/usage:
    get:
      operationId: usage_metrics_get
      summary: Knowledge-loop usage metrics
      description: >-
        Human-only. Metrics per agent for an ISO week, or for the rolling 7 days without `week`,
        and the owner's targets (ADR-0041). Not an MCP tool: the numbers describe the agents and
        are for the human.
      tags: [human-only]
      x-human-only: true
      security:
        - sessionToken: []
      parameters:
        - name: week
          in: query
          schema:
            $ref: '../api.schema.json#/$defs/usageMetricsRequest/properties/week'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: The usage metrics.
          content:
            application/json:
              schema:
                $ref: '../usage-metrics.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HumanOnly'
components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Worldbuilder-Session
      description: >-
        Random session token of the local board UI, created at start (ADR-0026). The only
        credential accepted by human-only operations.
    agentToken:
      type: http
      scheme: bearer
      description: >-
        Bearer token of one registered agent connection. It identifies the agent
        (`agent:<name>`) and its disclosure target class (ADR-0012, ADR-0026). Rejected with 403
        by every operation marked `x-human-only`.
  parameters:
    proposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: '../common.schema.json#/$defs/ulid'
    transferId:
      name: transferId
      in: path
      required: true
      schema:
        $ref: '../common.schema.json#/$defs/ulid'
  responses:
    BadRequest:
      description: Schema-invalid input.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    Unauthorized:
      description: Missing or unknown credential.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    Forbidden:
      description: The caller's target may not receive this (for example an unconfirmed cloud transfer).
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    HumanOnly:
      description: Human-only operation called with an agent token.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    NotFound:
      description: Unknown id, or not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    Conflict:
      description: >-
        Version conflict, a proposal that is already decided, or a transfer confirmation with a
        different payload hash or for an already confirmed transfer.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    Gone:
      description: The transfer or its token has expired; preview it again.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    ServiceUnavailable:
      description: >-
        The store is locked by another writer (problem type `store-locked`, title "Store locked"),
        or the receipt log is broken or cannot be written (problem type
        `receipt-log-unavailable`, title "Receipt log unavailable"). Retry later or, for the
        receipt log, repair it as a human (ADR-0040). Never carries card content.
      headers:
        Retry-After:
          description: Seconds to wait; present for a locked store.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    TooManyRequests:
      description: >-
        Too many requests for this credential in the current window, or too many failed
        credentials from this address (ADR-0047). Retry after the time in `Retry-After`. Never
        carries card content.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    BadGateway:
      description: >-
        A cloud level-1 engine failed or answered something that does not fit the request (a
        move outside the options, a card it was not sent). Fixed wording only: never the
        engine's answer text, its credential or its address.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
    TooLarge:
      description: Input exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: '../api.schema.json#/$defs/problem'
