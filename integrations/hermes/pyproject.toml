[project]
name = "worldbuilder-hermes"
version = "0.1.0"
description = "Worldbuilder knowledge loop for Hermes agents: native plugin, config and cron templates, and a fake-Hermes test harness"
license = "Apache-2.0"
requires-python = ">=3.11"
# The plugin itself uses only the standard library: Hermes runs it in its own interpreter.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.21", "pyyaml>=6", "ruff>=0.6"]

# Nothing here is installed as a package: the plugin is copied into $HERMES_HOME/plugins/. The
# project exists for the test extras, and an empty list keeps setuptools from auto-discovering
# the plugins/, config/ and cron/ folders as packages.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long literal lines in test fixtures (shell commands, PowerShell one-liners).
"tests/test_cron.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -q"
markers = ["needs_wb: runs the real `wb` command line (node and a built packages/knowledge-loop)"]
