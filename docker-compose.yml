#
# docker compose up --build, then open http://127.0.0.1:4310 with the session token from
# docker compose logs. The port is published on loopback only.
services:
  reraise:
    build: .
    image: reraise-toolkit
    ports:
      - '127.0.0.1:4310:4310'
    volumes:
      - reraise-data:/data
volumes:
  reraise-data:
