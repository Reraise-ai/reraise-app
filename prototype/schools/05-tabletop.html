<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reraise · tabletop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --table:#cdd8d0; --table2:#dbe4dd; --chrome:#f3f5f1; --chrome2:#e6ebe5;
  --text:#14221f; --mute:#4a5f59; --gold:#8a6718; --goldfill:#d9b565; --line:rgba(20,34,31,.18);
  --card:#fffdf6; --cardink:#1d1c18; --cardmute:#5b5a50; --cardline:rgba(29,28,24,.2);
  --P:#8a6718; --S:#34578a; --E:#456f48; --shadow:0 1px 0 rgba(0,0,0,.08),0 6px 14px rgba(20,34,31,.16);
  --serif:'Newsreader',Georgia,'Times New Roman',serif; --sans:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --glow:rgba(138,103,24,.55); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --table:#0f2a26; --table2:#143630; --chrome:#0a1a18; --chrome2:#112623;
  --text:#e7e3d3; --mute:#9bb3ab; --gold:#d6b062; --goldfill:#d6b062; --line:rgba(214,176,98,.28);
  --card:#efe8d5; --P:#8a6718; --S:#34578a; --E:#456f48; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.45);
  --glow:rgba(214,176,98,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --table:#0f2a26; --table2:#143630; --chrome:#0a1a18; --chrome2:#112623;
  --text:#e7e3d3; --mute:#9bb3ab; --gold:#d6b062; --goldfill:#d6b062; --line:rgba(214,176,98,.28);
  --card:#efe8d5; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.45); --glow:rgba(214,176,98,.7); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--table);color:var(--text);font:15px/1.45 var(--sans);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--chrome);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 16px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font:600 26px/1 var(--serif);letter-spacing:-.01em}
.brand small{font-size:11px;color:var(--mute)}
.tabs{display:flex;gap:2px;align-items:flex-end}
.tab{background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:7px 14px;font:600 15px var(--serif);color:var(--mute)}
.tab[aria-selected=true]{background:var(--table);color:var(--text);border-color:var(--line);box-shadow:0 2px 0 var(--table)}
.tab.new{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--gold)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{display:flex;gap:6px;align-items:center;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.tool:hover{border-color:var(--gold)}
.tool[aria-pressed=true]{background:var(--goldfill);color:#1d1c18;border-color:transparent}
.skip{margin-left:auto;background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px}
body[data-first="1"] .tabs,body[data-first="1"] .tools{display:none}
body[data-first="0"] .skip{display:none}

/* layout */
.table{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"seats rail" "felt rail" "tray rail";gap:0 18px;padding:0 16px;max-width:1500px;margin:0 auto;align-items:start}
.seats{grid-area:seats}.felt{grid-area:felt}.rail{grid-area:rail;padding-top:14px}.tray{grid-area:tray}
body[data-first="1"] .table{grid-template-columns:minmax(0,1fr);grid-template-areas:"felt" "tray"}
body[data-first="1"] .tray{grid-template-columns:1fr}
body[data-first="1"] .felt{margin-top:14px}
@media (min-width:761px){body[data-first="1"] .tray{position:static}}
body[data-first="1"] .seats,body[data-first="1"] .rail,body[data-first="1"] .timebar,body[data-first="1"] .deckbtn,body[data-first="1"] .pile{display:none}

/* seats */
.seats{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0 6px;align-items:stretch}
.seat{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:9px 14px 9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--table2);min-width:200px;flex:1 1 220px;max-width:340px}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px -4px var(--glow)}
.por{grid-row:span 2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 20px var(--serif);color:#1d1c18;background:var(--goldfill);border:2px solid var(--chrome);outline:1px solid var(--line)}
.p-you{background:#e7d3a3}.p-a1{background:#a9c7bd}.p-a2{background:#c7b0b0}.p-a3{background:#b7bfd8}.p-x{background:#cfcfc4}
.seat b{font:600 16px var(--serif)}
.seat .sub{font-size:12px;color:var(--mute)}
.ord{position:absolute;top:-8px;left:12px;background:var(--chrome);border:1px solid var(--line);border-radius:999px;font-size:11px;padding:0 7px;color:var(--mute)}
.mark{position:absolute;top:-10px;right:12px;background:var(--goldfill);color:#1d1c18;border-radius:999px;font-size:11px;font-weight:600;padding:1px 9px;display:none}
.seat.turn .mark{display:block}
.bub{grid-column:1/-1;margin-top:6px;font-size:12.5px;line-height:1.35;background:var(--chrome);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:6px 9px}
.bub span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stancebox{grid-column:1/-1;font-size:12px;color:var(--mute);margin-top:4px}
.stancebox span{color:var(--gold)}
.ctl{display:flex;flex-direction:column;gap:6px;justify-content:center}
.btn{border:1px solid var(--gold);background:none;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--text)}
.btn.main{background:var(--goldfill);color:#1d1c18;border-color:transparent;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.round{font:600 15px var(--serif);color:var(--mute);padding:0 4px}

/* felt */
.felt{background:radial-gradient(120% 90% at 50% 0,var(--table2),var(--table));border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;box-shadow:inset 0 0 0 5px var(--table),inset 0 0 0 6px var(--line)}
.ftitle{font:600 clamp(22px,2.6vw,32px)/1.12 var(--serif);max-width:30ch;margin:0 0 14px}
.fsub{color:var(--mute);font-size:13px;margin:-8px 0 14px}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lane h3{font-size:15px;letter-spacing:.01em;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.lane h3 span{font:400 12px var(--sans);color:var(--mute)}
.cell{border:1px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px;min-height:92px;transition:opacity .2s}
.cell.dim{opacity:.35}
.chead{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:6px}
.chead em{font-style:normal;opacity:.8}
.stack{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.slot{width:40px;min-height:70px;flex:none;border:1.5px dashed var(--line);background:none;border-radius:10px;color:var(--mute);font-size:20px;transition:all .15s}
.slot:hover{border-color:var(--gold);color:var(--gold)}
.cell.valid{border-color:var(--gold);border-style:solid;background:rgba(214,176,98,.07)}
.cell.valid .slot{width:90px;border-style:solid;border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px -2px var(--glow);animation:glow 1.4s ease-in-out infinite}
.cell.hot{background:rgba(214,176,98,.2)}
@keyframes glow{50%{box-shadow:0 0 6px 0 var(--glow)}}

/* cards */
.card{width:140px;background:var(--card);color:var(--cardink);border-radius:9px;padding:8px 10px 7px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1.5px solid var(--cardline);transition:transform .15s,outline-color .15s}
.card:hover{transform:translateY(-3px)}
.card header{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.card h4{font:600 14.5px/1.18 var(--serif)}
.card p{margin:0;font-size:12px;line-height:1.35;color:var(--cardmute)}
.card footer{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px;font-size:11px;color:var(--cardmute)}
.tok{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--sans);color:#1d1c18;background:#cfcfc4}
.lk{margin-left:auto}
.cp{font-style:normal;margin-left:auto;font-weight:400;color:var(--cardmute)}
.L-PROVEN{border-color:var(--P);border-top-width:4px}.L-PROVEN header{color:var(--P)}
.L-SAID{border-style:dashed;border-color:var(--S)}.L-SAID header{color:var(--S)}
.L-EXPERIENCE{border-style:dotted;border-width:2.5px;border-color:var(--E);border-radius:16px 9px 16px 9px}.L-EXPERIENCE header{color:var(--E)}
.card.rel{outline:2px solid var(--gold);outline-offset:2px}
.card.pulse{animation:pulse 1.6s ease-out 1}
.card.land{animation:land .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes land{from{transform:translateY(-30px) rotate(-4deg) scale(1.08);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow)}60%{box-shadow:0 0 0 14px transparent}}
.card.enter{animation:enter .5s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}

/* map */
.mapgrid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px}
.mapcol{display:flex;flex-direction:column;gap:10px}
.mapcol .card{width:auto}
.actor{padding:9px 11px}
.actor dl{margin:2px 0;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:12px}
.actor dt{color:var(--cardmute)}.actor dd{margin:0}
.actor dd.red{color:#8d2b2b;font-weight:600}
.next{margin-top:4px;font-size:12px;border-top:1px solid var(--cardline);padding-top:4px;display:flex;gap:6px;align-items:baseline}
.next i{font-style:normal;color:var(--cardmute)}
.focus{border:1px solid var(--gold);border-radius:16px;padding:12px;background:rgba(214,176,98,.08);text-align:center}
.focus .cell{text-align:left}
.focus .card{width:auto;margin:0 auto;max-width:300px}
.focus>h3{font-size:13px;color:var(--mute);font-family:var(--sans);font-weight:500;margin-bottom:8px}
.focus .stack{justify-content:flex-start}
.focus>.cell:first-of-type .stack{justify-content:center}

/* gold */
.chart{background:var(--chrome2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 2px;margin-bottom:14px}
.chart svg{display:block;width:100%;height:auto}
.chart .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:2px 4px 6px;flex-wrap:wrap;gap:4px}
.chart .flag{cursor:pointer}
.chart .flag:hover path,.chart .flag:focus path{fill:var(--gold)}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.zone h3{font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.zone .card{width:100%}
.zones.custom{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.under{font-size:12px;color:var(--mute);margin:-8px 0 12px}

/* time */
.timebar{margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.timebar output{color:var(--text);font:600 15px var(--serif);min-width:9ch;text-align:center}
input[type=range]{width:100%;accent-color:var(--gold)}

/* rail */
.sec{border:1px solid var(--line);border-radius:14px;background:var(--table2);padding:12px 14px;margin-bottom:14px}
.sec h3{font-size:17px;margin-bottom:8px}
.sec .hint{font-size:12px;color:var(--mute);margin:0 0 8px}
.fire{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding-right:2px}
.msg{max-width:92%;font-size:13.5px;padding:7px 10px;border-radius:4px 12px 12px 12px;background:var(--chrome);border:1px solid var(--line)}
.msg b{display:block;font-size:11px;color:var(--mute);font-weight:600}
.msg.me{align-self:flex-end;border-radius:12px 4px 12px 12px;background:var(--goldfill);color:#1d1c18;border-color:transparent}
.msg.me b{color:#3b3320}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.chip{border:1px solid var(--gold);background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--text)}
.chip:hover{background:var(--goldfill);color:#1d1c18}
.say{display:flex;gap:6px}
.say input,.fld input,.fld textarea,.fld select{width:100%;font:inherit;color:var(--text);background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rule{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px}
.rs{flex:none;border:1px solid var(--line);background:var(--chrome);border-radius:999px;font-size:12px;padding:2px 10px;min-width:92px;text-align:center}
.rs.ap{border-color:var(--E);color:var(--text)}.rs.no{border-style:dashed}.rs.un{border-style:dotted}
.rs.pr{border:0;background:none;color:var(--mute);font-style:italic}
.origins{font-size:12.5px;color:var(--mute);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mv{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.mv.undone .mt{text-decoration:line-through;color:var(--mute)}
.mv small{display:block;color:var(--mute);font-size:11px}
.mv button{border:1px solid var(--line);background:none;border-radius:999px;font-size:12px;padding:2px 10px}
.mv button:hover{border-color:var(--gold)}

/* tray */
.tray{position:sticky;bottom:0;z-index:15;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end;padding:10px 0 8px;background:linear-gradient(transparent,var(--table) 30%);margin-top:6px}
.deckbtn,.pile{width:84px;height:116px;border-radius:10px;border:1px solid var(--line);background:var(--chrome2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;text-align:center;padding:6px;position:relative;box-shadow:3px 3px 0 var(--chrome),4px 4px 0 var(--line)}
.deckbtn b,.pile b{font:600 14px var(--serif)}
.deckbtn:hover,.pile:hover{border-color:var(--gold)}
.pile{border-style:dashed;box-shadow:none}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:112px;overflow:visible;padding-top:12px;position:relative}
.coach{order:-1;grid-column:1/-1;text-align:center;font:italic 400 clamp(16px,2vw,20px) var(--serif);color:var(--gold);padding-bottom:2px}
.hcard{width:128px;height:138px;margin:0 -10px;background:var(--card);color:var(--cardink);border-radius:9px;border:1.5px solid var(--cardline);box-shadow:var(--shadow);padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:3px;touch-action:none;user-select:none;transform-origin:50% 130%;transform:rotate(var(--r)) translateY(calc(var(--y) + 38px));transition:transform .18s,margin .18s;position:relative;cursor:grab}
.hcard header{display:flex;gap:5px;align-items:center;font-size:11px;font-weight:600}
.hcard h4{font:600 14px/1.15 var(--serif)}
.hcard p{margin:0;font-size:11.5px;color:var(--cardmute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hcard:hover,.hcard.sel{transform:rotate(0) translateY(-6px);z-index:5}
body[data-first="1"] .hcard{transform:rotate(var(--r)) translateY(var(--y))}
body[data-first="1"] .hcard:hover,body[data-first="1"] .hcard.sel{transform:rotate(0) translateY(-14px)}
.hcard.sel{outline:2px solid var(--gold);outline-offset:2px}
.hcard.locked{filter:saturate(.3) brightness(.8);pointer-events:none}
.hcard.blank{background:var(--table2);color:var(--text);border:1.5px dashed var(--gold);box-shadow:none}
.hcard.blank p{color:var(--mute)}
.ghost{position:fixed;z-index:100;pointer-events:none;width:128px;opacity:.92;transform:rotate(-4deg) scale(1.08)}
.hcard.pilled{animation:land .5s}

/* dialogs */
dialog{border:1px solid var(--gold);border-radius:16px;background:var(--chrome);color:var(--text);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog.wide{width:min(900px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(5,15,13,.62)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--chrome)}
.dh h2{font-size:22px}
.x{border:0;background:none;font-size:24px;line-height:1;padding:0 6px}
.db{padding:16px 18px 20px;overflow:auto;max-height:calc(100vh - 110px)}
.row{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:8px 0;font-size:14px}
.row dt{color:var(--mute)}.row dd{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.fld{display:block;margin:10px 0;font-size:13px;color:var(--mute)}
.fld input,.fld textarea,.fld select{margin-top:4px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.opt{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px;color:var(--text);cursor:pointer}
.opt:has(input:checked){border-color:var(--gold);background:rgba(214,176,98,.14)}
.note{font-size:12.5px;color:var(--mute)}
.err{color:#b04040;font-size:13px;min-height:1.2em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.li small{color:var(--mute);display:block}
.li button{border:1px solid var(--gold);background:none;border-radius:999px;padding:3px 12px;font-size:12.5px}
.li button:hover{background:var(--goldfill);color:#1d1c18}
.big{font:600 34px/1 var(--serif)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px}
.stat span{display:block;font-size:12px;color:var(--mute)}
.oracle{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.flip{perspective:900px;height:210px;border:0;background:none;padding:0}
.flip i{display:block;position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;font-style:normal}
.flip.on i{transform:rotateY(180deg)}
.flip i>*{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;padding:10px;text-align:left}
.fb{background:var(--chrome2);border:1.5px solid var(--gold);display:grid;place-items:center;font:600 28px var(--serif);color:var(--gold)}
.ff{transform:rotateY(180deg);background:var(--card);color:var(--cardink);font-size:12.5px;line-height:1.35;overflow:auto;border:1.5px dashed var(--S)}
.ff b{display:block;font:600 14px var(--serif);margin-bottom:4px;color:var(--S)}
.steps{display:flex;gap:8px;margin-bottom:12px;font-size:13px;color:var(--mute)}
.steps span{padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.steps .on{border-color:var(--gold);color:var(--text);background:rgba(214,176,98,.14)}
.under-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.up{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;background:none;display:block}
.up:has(input:checked){border-color:var(--gold);background:rgba(214,176,98,.14)}
.up b{font:600 16px var(--serif);display:block}.up span{font-size:12.5px;color:var(--mute)}
.up input{position:absolute;opacity:0}

function chartHTML(){

  const pts=PRICE.map((v,i)=>[x(i),y(v)]);
  const d=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const flags=cardsOf('gold').filter(c=>c.cell&&!c.off&&!c.inHand&&c.t<=t);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gold price in USD per ounce, month ends October 2025 to October 2026">`;
  [4000,4400,4800].forEach(v=>s+=`<line x1="40" x2="${W-14}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="36" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${v}</text>`);
  MONTHS.forEach((m,i)=>{if(i%2===0)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mute)">${m}</text>`});
  s+=`<path d="${d(pts)}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="2 5" opacity=".6"/>`;
  s+=`<path d="${d(pts.slice(0,t+1))}" fill="none" stroke="var(--gold)" stroke-width="2.6" stroke-linejoin="round"/>`;
  s+=`<line x1="${x(t)}" x2="${x(t)}" y1="14" y2="182" stroke="var(--gold)" stroke-width="1" opacity=".7"/><circle cx="${x(t)}" cy="${y(PRICE[t])}" r="5" fill="var(--gold)"/>`;
  flags.forEach(c=>{const i=c.t,px=x(i),py=y(PRICE[i]),top=Math.max(18,py-52+(i%2)*14);
    const w=Math.min(150,Math.min(c.title.length,28)*6.2+18);const left=px+w>W-10;const a=left?-1:1;
    s+=`<g class="flag" data-card="${c.id}" tabindex="0" role="button" aria-label="${esc(c.title)}, ${MONTHS[i]}"><line x1="${px}" x2="${px}" y1="${py}" y2="${top}" stroke="var(--text)" stroke-width="1.2"/><path d="M${px} ${top}h${a*w}v17h${-a*(w-8)}z" fill="${c.layer==='PROVEN'?'var(--card)':'var(--chrome)'}" stroke="${c.layer==='PROVEN'?'var(--P)':'var(--S)'}" stroke-width="1.4" ${c.layer==='SAID'?'stroke-dasharray="3 2"':''}/><text x="${px+a*10}" y="${top+12.5}" ${left?'text-anchor="end"':''} font-size="10.5" fill="${c.layer==='PROVEN'?'#1d1c18':'var(--text)'}">${esc(c.title.length>28?c.title.slice(0,27)+'…':c.title)}</text></g>`});
  s+='</svg>';
  return `<div class="chart">${s}<div class="cap"><span>${MONTHS[t]}: USD ${PRICE[t].toLocaleString('en-US')} per oz</span><span>Example series, month ends. Flags are cards.</span></div></div>`;
}

function place(hid,cellId){
  const f=F_(),cell=f.cells.find(x=>x.id===cellId);if(!cell)return;
  if(hid==='blankP'||hid==='blankE'){return openLay(cellId,hid==='blankE'?'EXPERIENCE':null)}
  const c=S.cards[hid];if(!okSlot(c,cell)){toast(`That slot takes ${LM[cell.accept].n.toLowerCase()} cards.`);return}
  c.cell=cellId;c.inHand=false;c.placed=true;c.fromHand=true;c.field=f.id;c.fresh=true;S.sel=null;
  addMove('you',`${nameOf('you')} laid “${c.title}”`,[c.id]);

  if(t==='oracle'){const q=f.question,a=ORACLE[f.id]||['Needs a source first.','Unclear.','Depends on the lens.','Hard to say.','Not enough to go on.'];
    return dialog('5 AI models say',`<p class="note">Question: <b style="color:var(--text)">${esc(q)}</b><br>Five models answered. This is its own layer, separate from your cards. It is not a verdict of the board.</p><div class="oracle">${a.map((x,i)=>`<button class="flip" data-act="flip" aria-label="Turn over model ${'ABCDE'[i]}"><i><span class="fb">${'ABCDE'[i]}</span><span class="ff"><b>Model ${'ABCDE'[i]}</b>${esc(x)}<br><span class="chip" data-act="oraclecard" data-i="${i}" style="display:inline-block;margin-top:8px;cursor:pointer">Take as said</span></span></i></button>`).join('')}</div>`,null,1)}
  if(t==='community')return dialog('Community',`<div class="two"><div><h3>Tables</h3><ul class="list" style="margin-top:8px">${TABLES.map((x,i)=>`<li class="li"><span>${esc(x[0])}<small>${esc(x[1])}</small></span><button data-act="join" data-i="${i}">${S.joined.has(x[0])?'Seated':'Observe'}</button></li>`).join('')}</ul></div>
   <div><h3>Shared wiki</h3><p class="note">Built from cards members traded. Each keeps its author.</p><ul class="list" style="margin-top:8px">${WIKI.map(w=>`<li class="li"><span>${esc(w[0])}<small>${w[1]} · ${w[2]} · ${w[3]}</small></span></li>`).join('')}</ul></div></div>`,null,1);
  if(t==='member'){const mine=Object.values(S.cards).filter(c=>c.by==='you'&&c.cell&&!c.off&&(c.src||c.said)).length,sourced=Object.values(S.cards).filter(c=>c.cell&&!c.off&&!c.inHand&&c.layer==='PROVEN').length;
    return dialog('Membership',`<div style="display:flex;gap:14px;align-items:center"><div class="por p-you" style="width:64px;height:64px;font-size:30px">K</div><div><div class="big">#1 Kane</div><div class="note">Member #2 is Chris. Numbers are never reissued.</div></div></div>
   <div class="stats"><div class="stat"><span>Standing: cards with a source</span><b class="big">${sourced}</b></div><div class="stat"><span>Takes</span><b class="big">${S.takes}</b></div><div class="stat"><span>Origin points (others took your cards)</span><b class="big">${S.taken}</b></div></div>
   <p class="note">Standing counts cards with a source, takes, and origin points. It never counts whether a card is right or wrong.</p>
   <ul class="list" style="margin-top:12px"><li class="li"><span><b>Board</b><small>Free. Three fields, your agents, your rules.</small></span><span class="note">Yours</span></li><li class="li"><span><b>Exchange</b><small>Optional. Trade cards, join community tables.</small></span><span class="note">On</span></li><li class="li"><span><b>Premium</b><small>Private Executive, built in from the start.</small></span><span class="note">Included</span></li></ul>`)}
}
function openPing(){
  const pool=Object.values(S.cards).filter(c=>c.field!==S.field&&!c.copyOf&&!c.inHand&&c.cell&&!c.actor).concat(Object.values(S.cards).filter(c=>c.copyOf&&c.field!==S.field));
  const own=[...S.deck].map(i=>S.cards[i]).filter(Boolean);const all=[...new Set([...own,...pool])];
  dialog('Ping a card',`<label class="fld">Search your knowledge and the shared wiki<input id="pq" placeholder="Try: insurance, trial, banks" autocomplete="off"></label><ul class="list" id="pr"></ul>`,()=>{
    const draw=q=>{const r=all.filter(c=>(c.title+' '+(c.body||'')+' '+byLabel(c)).toLowerCase().includes(q.toLowerCase()));
      $('#pr').innerHTML=r.length?r.map(c=>`<li class="li"><span>${esc(c.title)}<small>${LM[c.layer].n} · ${esc(byLabel(c))} · from ${esc(F[c.field]?F[c.field].name:'')}${S.deck.has(c.id)?' · in your deck':''}</small></span><button data-act="ping" data-id="${c.id}">Draw to hand</button></li>`).join(''):'<li class="note">No card matches. Try a shorter word, or write a new card from your hand.</li>'};
    draw('');$('#pq').oninput=e=>draw(e.target.value);$('#pq').focus()});
}
function newField(){
  const st={u:'Debate',z:'Supports, Refutes',seats:[['a1','Research','agent'],['a2','Rebuttal','agent']]};
  let step=0;const un=[['Debate','Two sides of one claim.','Supports, Refutes'],['Map','Actors around one focus.','Actors, Focus, Evidence'],['Chart','A time line on top, zones below.','Demand, Supply, Macro'],['Blank','Open slots, your zones.','Zone 1, Zone 2']];
  const draw=()=>{
    const body=[()=>`<div class="under-pick">${un.map((u,i)=>`<label class="up"><input type="radio" name="u" value="${u[0]}" ${st.u===u[0]?'checked':''}><b>${u[0]}</b><span>${u[1]}</span></label>`).join('')}</div>`,
      ()=>`<label class="fld">Name of the field<input name="name" value="${esc(st.name||'')}" placeholder="e.g. Heat pumps" maxlength="30"></label><label class="fld">Zones, separated by commas<input name="z" value="${esc(st.z)}"></label><p class="note">Each zone becomes a place on the board with open slots.</p>`,
      ()=>`<p class="note">Seats at the table and who moves for each. Roles are the part each plays.</p><div class="list">${[['you','You','human']].concat(st.seats).map((s,i)=>`<div class="li"><span>${esc(s[1])}</span><select name="m${i}" ${i?'':'disabled'}>${['human','agent','model'].map(m=>`<option ${s[2]===m?'selected':''}>${m}</option>`).join('')}</select></div>`).join('')}</div><button type="button" class="btn" data-act="addseat" style="margin-top:8px">+ Add a seat</button>`,
      ()=>`<p>You are about to open <b>${esc(st.name||'New field')}</b> on the <b>${st.u}</b> underlay with ${st.z.split(',').filter(x=>x.trim()).length} zones and ${st.seats.length+1} seats.</p><p class="note">Seats: ${['You (human)'].concat(st.seats.map(s=>`${s[0].toUpperCase()} ${s[1]} (${s[2]})`)).join(', ')}.</p>`][step]();
    $('#db').innerHTML=`<div class="steps">${['Underlay','Zones','Seats and movers','Open'].map((s,i)=>`<span class="${i===step?'on':''}">${i+1}. ${s}</span>`).join('')}</div>${body}<div class="acts"><button class="btn" data-act="nfback" ${step?'':'disabled'}>Back</button><button class="btn main" data-act="nfnext">${step===3?'Open the field':'Next'}</button></div>`;
    $$('input[name=u]').forEach(r=>r.onchange=()=>{st.u=r.value;st.z=un.find(x=>x[0]===r.value)[2]});
  };
  newField.st=st;newField.step=()=>step;newField.go=d=>{const n=$('#db input[name=name]');if(n)st.name=n.value;const z=$('#db input[name=z]');if(z)st.z=z.value;
    $$('#db select').forEach((s,i)=>{if(i&&st.seats[i-1])st.seats[i-1][2]=s.value});
    step=Math.max(0,Math.min(3,step+d));draw()};
  dialog('New field','',draw,1);
}
function createField(st){
  const id='x'+(++S.k),nm=(st.name||'New field').trim()||'New field',zs=st.z.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6);
  const seatIds=['you'];st.seats.forEach((s,i)=>{const sid='s'+id+i;SEATS[sid]={n:s[0].toUpperCase(),s:`${s[2][0].toUpperCase()+s[2].slice(1)} · ${s[1]}`,p:'x',mover:s[2]};seatIds.push(sid)});
  F[id]={id,name:nm,type:'zones',underlay:st.u,title:nm,seats:seatIds,times:['Start','Now'],cells:zs.map((z,i)=>({id:id+'z'+i,accept:null,label:z})),question:`What do you make of ${nm}?`};
  S.order.push(id);S.time[id]=1;S.turn[id]=0;S.round[id]=1;S.moves[id]=[];S.fire[id]=[];S.rules[id]=[];
  say(id,'you',`New field: ${nm}.`);S.field=id;closeDlg();renderAll();toast('Field opened. Lay the first card.');
}
async function endTurn(){
  const f=F_();if(S.busy)return;S.busy=true;renderSeats();
  for(let i=1;i<f.seats.length;i++){S.turn[f.id]=i;renderSeats();await sleep(750);const a=f.seats[i],lm=S.last[f.id];
    say(f.id,a,lm?`Seen: ${lm}. ${a==='a2'?'I will look for what stands on the other side.':'I will look for a source that sits next to it.'}`:'Nothing new from me this turn.');S.last[f.id]=null;renderSeats();renderRail()}
  await sleep(500);S.turn[f.id]=0;S.round[f.id]++;S.busy=false;renderAll();
}
const ROUNDS={claim:{roles:{you:'Moderator',a1:'Plays the Córdoba side',a2:'Plays the São Paulo side'},r:[[['a1','Córdoba side: 1 of 50 treated needed intensive care, 13 of 26 untreated.','c1'],['a2','São Paulo side: median 7 days in hospital with vitamin D3, 7 with placebo.','c7']],[['a1','Late dosing: São Paulo began 10.3 days after symptoms.','c3'],['a2','Córdoba was open, with no placebo.','c8']]]},
 map:{roles:{you:'Observes, sets the stance',a1:'Plays USA, Saudi Arabia',a2:'Plays Iran, Russia',a3:'Plays China, Israel'},r:[[['a1','USA: tanker escort.','m_usa'],['a2','Iran: stop a tanker.','m_iran'],['a3','China: offers mediation.','m_china']],[['a1','Saudi Arabia: raises output.','m_saudi'],['a2','Russia: supports price via cuts.','m_russia'],['a3','Israel: warns Iran covertly.','m_israel']]]},
 gold:{roles:{you:'Moderator',a1:'Plays Demand',a2:'Plays Supply'},r:[[['a1','Demand: central banks keep buying.','g1'],['a2','Supply: mine output is flat.','g5']],[['a1','Demand: ETF inflows are at a record.','g2'],['a2','Supply: with output flat, the price leans on demand.','g5']]]}};
Object.entries(ROUNDS).forEach(([k,v])=>F[k].roles=v.roles);
function playRound(){
  const f=F_(),def=ROUNDS[f.id];if(!def){toast('Role play needs roles. Add them when you set up the field.');return}
  const r=def.r[(S.round[f.id]-1)%def.r.length];const ids=[];
  r.forEach(x=>{say(f.id,x[0],x[1]);ids.push(x[2])});
  addMove('a1',`Round ${S.round[f.id]}: ${r.map(x=>nameOf(x[0])).join(', ')} played`,[]);
  ids.forEach(i=>S.cards[i].pulse=true);S.round[f.id]++;renderAll();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'),cd=e.target.closest('[data-card]'),sl=e.target.closest('[data-slot]');
  if(a){const act=a.dataset.act;
    if(act==='close')return closeDlg();
    if(act==='tab'){S.field=a.dataset.f;S.sel=null;renderAll();return window.scrollTo(0,0)}
    if(act==='newfield')return newField();
    if(act==='nfnext'){if(newField.step()===3){newField.go(0);return createField(newField.st)}return newField.go(1)}
    if(act==='nfback')return newField.go(-1);
    if(act==='addseat'){newField.go(0);const n=newField.st.seats.length+1;newField.st.seats.push(['a'+n,'Agent '+n,'agent']);return newField.go(0)}
    if(act==='tool')return tool(a.dataset.t);
    if(act==='theme'){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;a.textContent=S.theme[0].toUpperCase()+S.theme.slice(1);return}
    if(act==='role'){S.role=!S.role;toast(S.role?'Role play on. Agents play the actors, one round at a time.':'Role play off.');return renderAll()}
    if(act==='playround')return playRound();
    if(act==='endturn')return endTurn();
    if(act==='skipintro'){S.first=false;S.entering=true;return renderAll()}
    if(act==='pile'){S.moves[S.field].some(m=>m.undone);return $('#logsec').scrollIntoView({behavior:'smooth',block:'center'})}
    if(act==='takeback'){const m=S.moves[S.field][+a.dataset.i];m.undone=!m.undone;
      m.ids.forEach(id=>{const c=S.cards[id];if(c.fromHand)c.inHand=m.undone,c.off=false;else c.off=m.undone;if(!m.undone)c.fresh=true});
      toast(m.undone?'Taken back. It waits in the discard pile.':'Replayed.');return renderAll()}
    if(act==='rule'){const r=S.rules[S.field][+a.dataset.i];r[1]={ap:'no',no:'un',un:'ap'}[r[1]];return renderRail()}
    if(act==='chip'){const c=CHIPS[S.field][+a.dataset.i];say(S.field,'you',c[2]);renderRail();setTimeout(()=>{say(S.field,c[1],c[3]);renderSeats();renderRail()},650);return}
    if(act==='take'){const c=S.cards[a.dataset.id];S.deck.add(c.id);takeCard(c);S.last[S.field]=null;closeDlg();renderAll();return toast('Taken into your deck and hand. The origin stays with '+byLabel(c)+'.')}
    if(act==='star'){const id=a.dataset.id;S.stance.has(id)?S.stance.delete(id):S.stance.add(id);openCard(id);return renderSeats()}
    if(act==='connform')return connForm(a.dataset.id);
    if(act==='jump'){closeDlg();S.field=a.dataset.f;renderAll();return window.scrollTo(0,0)}
    if(act==='opensrc')return toast('The original opens in a new tab in the live product.');
    if(act==='flip')return a.classList.toggle('on');
    if(act==='oraclecard'){{const i=+a.dataset.i;const id='o'+(++S.k);C(id,S.field,'Model '+'ABCDE'[i],ORACLE[S.field][i],'SAID','Model '+'ABCDE'[i],null,0,{said:'Model '+'ABCDE'[i]+', one of five models asked',inHand:true,fromHand:true,placed:false,fresh:true});closeDlg();renderAll();return toast('In your hand as a said card, not as a verdict.')}}
    if(act==='join'){const t=TABLES[+a.dataset.i][0];S.joined.has(t)?0:S.joined.add(t);a.textContent='Seated';return toast('You are watching this table as a guest. Joining asks its host.')}
    if(act==='takeoffer'){const o=OFFERS[+a.dataset.i];const id='o'+(++S.k);C(id,S.field,o.t,'',o.l,o.o,null,0,{src:o.src,said:o.said,inHand:true,fromHand:true,fresh:true,copyOf:'ext'+a.dataset.i});S.deck.add(id);S.takes++;a.disabled=true;a.textContent='Taken';renderHand();return toast('In your hand. Origin stays with '+o.o+'.')}
    if(act==='offer'){S.offered.add(+a.dataset.i);S.taken++;a.disabled=true;a.textContent='Offered';return toast('On your shelf. Your name stays on the card.')}
    if(act==='ping'){const c=S.cards[a.dataset.id];takeCard(c);S.takes--;closeDlg();renderAll();return toast('Drawn to your hand. It counts once with its origin.')}
    return;
  }
  if(sl){const id=sl.dataset.slot;if(S.sel)return place(S.sel,id);return openLay(id,null)}
  if(cd){if(cd.closest('dialog')&&e.target.closest('a'))e.preventDefault();return openCard(cd.dataset.card)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-act]');if(!f)return;e.preventDefault();
  if(f.dataset.act==='send'){const v=$('#sayin').value.trim();if(!v)return;say(S.field,'you',v);const f2=F_(),to=/@A2/i.test(v)&&f2.seats.includes('a2')?'a2':/@A3/i.test(v)&&f2.seats.includes('a3')?'a3':'a1';
    renderRail();setTimeout(()=>{say(f2.id,to,to==='a2'?'Understood. I will look for the strongest card on the other side and lay it with its origin.':to==='a3'?'Understood. I will play it through as the actor and show my reasoning.':'Understood. I will look for a source and lay it as a card, proven only if I can link the original. What is true stays your call.');renderSeats();renderRail()},650)}
  if(f.dataset.act==='addrule'){const v=$('#rulein').value.trim();if(!v)return;S.rules[S.field].push([v,'un']);renderRail()}
});
document.addEventListener('input',e=>{if(e.target.id==='tslide'){S.time[S.field]=+e.target.value;const sel=S.sel;renderBoard();renderSeats();$('#timebar output').textContent=F_().times[S.time[S.field]];renderHand()}});
document.addEventListener('mouseover',e=>{const c=e.target.closest('.card[data-card]');$$('.card.rel').forEach(x=>x.classList.remove('rel'));if(!c||c.closest('dialog'))return;const o=S.cards[c.dataset.card];links(o).forEach(l=>$$(`[data-card="${l.id}"]`).forEach(x=>x.classList.add('rel')))});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sel){S.sel=null;renderHand();markValid()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card,.hcard,.flag')){e.preventDefault();e.target.click()}
});

/* pointer drag from hand */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.hcard');if(!h||h.classList.contains('locked'))return;
  drag={id:h.dataset.hand,el:h,x:e.clientX,y:e.clientY,on:false,ghost:null,pid:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.on=true;S.sel=drag.id;const g=drag.el.cloneNode(true);g.className='hcard ghost'+(drag.el.classList.contains('blank')?' blank':'');g.style.cssText='';document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity='.35';markValid()}
  if(drag.on){drag.ghost.style.left=(e.clientX-64)+'px';drag.ghost.style.top=(e.clientY-70)+'px';
    $$('.cell.hot').forEach(x=>x.classList.remove('hot'));const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.cell.valid');c&&c.classList.add('hot')}
});
document.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.on){d.ghost.style.display='none';const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.cell.valid');d.ghost.remove();$$('.cell.hot').forEach(x=>x.classList.remove('hot'));
    if(c){place(d.id,c.dataset.cell)}else{S.sel=null;renderHand();markValid()}
  }else{S.sel=S.sel===d.id?null:d.id;renderHand();markValid();
    if(S.sel)toast(S.first?'Now tap the glowing slot.':'Tap a glowing slot to lay it, or drag.')}
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;S.sel=null;renderHand();markValid()});
document.addEventListener('dblclick',e=>{const h=e.target.closest('.hcard[data-hand]');if(h&&S.cards[h.dataset.hand])openCard(h.dataset.hand)});

renderAll();
</script>
</body>
</html>
