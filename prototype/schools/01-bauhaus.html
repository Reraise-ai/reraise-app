<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reraise board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--p:#fff;--i:#000;--g:#666;--r:#cfcfcf;--a:#e4400b;--f:"IBM Plex Sans",Helvetica,Arial,sans-serif;--m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--gut:32px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#000;--i:#f2f2f2;--g:#9a9a9a;--r:#3b3b3b;--a:#ff5a1f}}
:root[data-theme=dark]{--p:#000;--i:#f2f2f2;--g:#9a9a9a;--r:#3b3b3b;--a:#ff5a1f}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{background:var(--p)}
body{background:var(--p);color:var(--i);font:400 15px/1.45 var(--f);-webkit-font-smoothing:antialiased;max-width:1440px;margin:0 auto;padding:0 var(--gut) 64px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.mono,.cn,.cm,dt,.sm{font-family:var(--m);font-size:12px;letter-spacing:.01em}
.g{color:var(--g)}
.u{text-decoration:underline;text-underline-offset:3px}
/* header */
.top{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0 14px;border-bottom:1px solid var(--i)}
.mark{font-weight:600;font-size:22px;letter-spacing:-.03em;line-height:1}
.pb{font-family:var(--m);font-size:12px;color:var(--g);margin-left:14px}
.top .btn{font-family:var(--m);font-size:12px}
.fields{display:flex;gap:28px;padding:12px 0;border-bottom:1px solid var(--r);flex-wrap:wrap}
.fields button{font-weight:400;padding:2px 0;border-bottom:2px solid transparent}
.fields button[aria-selected=true]{font-weight:600;border-color:var(--i)}
.fields .plus{margin-left:auto;font-family:var(--m);font-size:13px}
.head{display:grid;grid-template-columns:repeat(12,1fr);gap:0 var(--gut);padding:28px 0 12px}
h1{grid-column:1/9;font-weight:500;font-size:clamp(26px,3.6vw,46px);line-height:1.08;letter-spacing:-.025em;max-width:22ch}
#players{grid-column:9/13;align-self:end;font-family:var(--m);font-size:12px;color:var(--g);line-height:1.7}
.time{display:grid;grid-template-columns:5rem 1fr minmax(8rem,auto);gap:var(--gut);align-items:center;padding:14px 0;border-top:1px solid var(--r);border-bottom:1px solid var(--r);margin-top:16px}
.time label{font-family:var(--m);font-size:12px;color:var(--g)}
.time output{font-family:var(--m);font-size:12px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:24px}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--i)}
input[type=range]::-moz-range-track{height:1px;background:var(--i)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--a);margin-top:-6px;border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--a);border:0;border-radius:0}
.stops{display:flex;justify-content:space-between;font-family:var(--m);font-size:11px;color:var(--g);margin-top:2px}
/* key */
.key{display:grid;grid-template-columns:repeat(12,1fr);gap:0 var(--gut);padding:14px 0;border-bottom:1px solid var(--r);align-items:start}
.key .lead{grid-column:1/5;font-weight:500;font-size:16px;line-height:1.3}
.key .lead span{display:block;color:var(--g);font-weight:400;font-size:13px;margin-top:4px}
.key .sp{grid-column:span 2;font-size:13px;line-height:1.35}
.key .sp b{display:block;margin-bottom:2px}
.key .x{grid-column:12/13;text-align:right;font-family:var(--m);font-size:12px}
.keyshow{font-family:var(--m);font-size:12px;padding:8px 0;color:var(--g);text-decoration:underline;text-underline-offset:3px}
/* layer typography */
.ly{font-family:var(--f);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.ly.P{font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.ly.S{font-weight:400;font-style:italic}
.ly.E{font-weight:300;letter-spacing:.2em}
.card.S h4{font-style:italic;font-weight:500}
.card.P h4{font-weight:600}
.card.E h4{font-weight:400}
.card.E{padding-left:14px;border-left:1px solid var(--i)}
/* layout */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 var(--gut);padding-top:20px}
#sheet{grid-column:1/9;position:relative;min-width:0}
#reg{grid-column:9/13;border-left:1px solid var(--i);padding-left:var(--gut);min-width:0}
.tools{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;padding-bottom:14px;font-size:13px}
.tools .sm{color:var(--g)}
.tools button{font-weight:500;text-decoration:underline;text-underline-offset:3px}
.tools button[aria-pressed=true]{color:var(--a)}
/* cards */
.card{position:relative;border-top:1px solid var(--i);padding:8px 0 16px;cursor:pointer;min-width:0}
.card:hover h4{text-decoration:underline;text-underline-offset:3px}
.card.sel{border-top:3px solid var(--a);padding-top:6px}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cn{color:var(--g)}
.card h4{font-size:15px;line-height:1.3;letter-spacing:-.005em}
.card p{font-size:13.5px;margin-top:4px;color:var(--i);max-width:46ch;hyphens:auto}
.cm{color:var(--g);margin-top:8px;font-size:11.5px}
.star{color:var(--a);font-size:14px;margin-right:6px}
.empty{border-top:1px solid var(--r);padding:8px 0 16px;color:var(--g);font-size:13px}
.empty button{text-decoration:underline;text-underline-offset:3px;color:var(--i)}
.deb{display:grid;grid-template-columns:6rem 1fr 1fr;column-gap:var(--gut)}
.deb .hd{font-weight:600;font-size:13px;padding-bottom:8px;letter-spacing:.09em;text-transform:uppercase}
.deb .rl{padding-top:8px;display:flex;align-items:flex-start}
.deb>div{min-width:0}
.deb .col{border-left:1px solid var(--r);padding-left:calc(var(--gut)/2);margin-left:calc(var(--gut)/-2)}
.map3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:var(--gut)}
.actor dl{display:grid;grid-template-columns:4.5rem 1fr;gap:2px 8px;margin-top:6px;font-size:13.5px}
.actor dt{color:var(--g);padding-top:2px}
.actor dd.nx{font-style:italic}
.focal{margin:8px 0 12px;border-top:3px solid var(--a);padding:10px 0 6px}
.focal .fh{font-family:var(--m);font-size:12px;color:var(--g);margin-bottom:6px}
.focal .ft{font-size:clamp(20px,2.4vw,30px);line-height:1.15;letter-spacing:-.02em;font-weight:500;cursor:pointer;display:block;margin-bottom:12px}
.focal .ft:hover{text-decoration:underline;text-underline-offset:4px}
.focal .cols{display:grid;grid-template-columns:repeat(3,1fr);column-gap:var(--gut)}
.focal .cols .ct{font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding-bottom:6px}
.zones{display:grid;grid-template-columns:repeat(var(--z,3),1fr);column-gap:var(--gut);margin-top:8px}
.zones .zt{font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;padding-bottom:8px}
.slot{border-top:1px solid var(--r);padding:8px 0 14px;font-size:13.5px;color:var(--g)}
.slot button{text-decoration:underline;text-underline-offset:3px;color:var(--i)}
#chart{width:100%;margin-bottom:8px}
#chart svg{display:block;width:100%;font-family:var(--m);font-size:11px}
.fl{cursor:pointer}
.fl:focus-visible{outline:2px solid var(--a)}
.lnk{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.leg{font-family:var(--m);font-size:11px;color:var(--g)}
/* register */
.ridx{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--gut);border-top:1px solid var(--i)}
.ridx button{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--r);font-size:14px}
.ridx button[aria-selected=true]{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.ridx .n{font-family:var(--m);font-size:11px;color:var(--g);font-weight:400}
.rh{font-weight:500;font-size:18px;letter-spacing:-.01em;margin:20px 0 4px;line-height:1.25}
.rs{font-size:13px;color:var(--g);margin-bottom:12px;max-width:44ch}
.msg{display:grid;grid-template-columns:4.2rem 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--r);font-size:14px}
.msg .w{font-family:var(--m);font-size:12px;color:var(--g);padding-top:2px}
.msg.me .w{color:var(--i);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0}
.chips button,.lk{font-size:13px;text-decoration:underline;text-underline-offset:3px}
.send{display:grid;grid-template-columns:auto 1fr auto;gap:8px;border-top:1px solid var(--i);padding-top:10px;align-items:center}
input[type=text],input[type=search],select,textarea{font:inherit;font-size:14px;background:var(--p);color:var(--i);border:0;border-bottom:1px solid var(--i);padding:6px 0;width:100%;min-width:0}
textarea{border:1px solid var(--i);padding:8px;min-height:84px;resize:vertical}
select{width:auto;max-width:100%}
.act{font-weight:600;border:1px solid var(--i);padding:6px 14px;font-size:13px;text-align:center}
.act:hover{background:var(--i);color:var(--p)}
.act.pri{background:var(--i);color:var(--p)}
.act.pri:hover{background:var(--a);border-color:var(--a);color:#fff}
.act[disabled]{opacity:.35;pointer-events:none}
.rule{display:grid;grid-template-columns:1fr auto;gap:12px;width:100%;padding:9px 0;border-top:1px solid var(--r);font-size:14px;align-items:baseline}
.st{font-family:var(--m);font-size:12px;white-space:nowrap}
.st.ap{font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.st.no{text-decoration:line-through}
.st.un{color:var(--g)}
.og{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--r);padding:7px 0;font-size:13.5px}
.lg{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--r);font-size:14px;align-items:baseline}
.lg.undone .t{text-decoration:line-through;color:var(--g)}
.lg .mono{color:var(--g);display:block}
.lg button{font-family:var(--m);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.tr{border-top:1px solid var(--r);padding:10px 0 12px}
.tr .row{display:flex;justify-content:space-between;gap:12px;margin-top:8px;align-items:baseline}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 8px}
.tbl td,.tbl th{border-top:1px solid var(--r);padding:7px 8px 7px 0;text-align:left;vertical-align:top;font-weight:400}
.tbl th{font-family:var(--m);font-size:11px;color:var(--g)}
.tbl td.r,.tbl th.r{text-align:right;padding-right:0}
.big{font-size:34px;font-weight:300;letter-spacing:-.03em;line-height:1}
.mod{border-top:1px solid var(--r);padding:10px 0;font-size:14px;display:grid;grid-template-columns:4.2rem 1fr;gap:8px}
.mod .w{font-family:var(--m);font-size:12px;color:var(--g)}
.mod button{display:block;margin-top:6px;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.sw{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--r);border-bottom:1px solid var(--r);padding:9px 0;margin:10px 0;font-size:14px}
.sw button{font-family:var(--m);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.sw button[aria-pressed=true]{color:var(--a);font-weight:500}
/* dialog */
dialog{border:1px solid var(--i);background:var(--p);color:var(--i);width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;margin:auto;overflow:auto}
dialog::backdrop{background:rgba(255,255,255,.88)}
:root[data-theme=dark] dialog::backdrop{background:rgba(0,0,0,.82)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) dialog::backdrop{background:rgba(0,0,0,.82)}}
.dl{padding:20px 24px 24px}
.dl .dh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--i);padding-bottom:10px;margin-bottom:14px}
.dl h2{font-weight:500;font-size:28px;line-height:1.12;letter-spacing:-.025em;margin-bottom:6px}
.dl .body{font-size:15px;max-width:52ch;margin-bottom:10px}
.dl dl{display:grid;grid-template-columns:6.5rem 1fr;gap:0}
.dl dt{padding:7px 0;border-top:1px solid var(--r);color:var(--g)}
.dl dd{padding:7px 0;border-top:1px solid var(--r);font-size:14px}
.dl .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.dl .conn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;border-top:1px solid var(--i);padding-top:12px;font-size:13px}
.dl .note{font-size:12.5px;color:var(--g);margin-top:8px}
.fm label{display:block;font-family:var(--m);font-size:11.5px;color:var(--g);margin:14px 0 4px}
.fm .rad{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;padding:4px 0}
.fm .rad label{display:inline-flex;gap:6px;align-items:center;margin:0;color:var(--i);font-family:var(--f);font-size:14px}
.fm .step{border-top:1px solid var(--i);margin-top:16px;padding-top:2px}
.fm .seat{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid var(--r);padding:6px 0}
.toast{position:fixed;left:var(--gut);bottom:16px;background:var(--i);color:var(--p);font-family:var(--m);font-size:12px;padding:8px 12px;max-width:calc(100vw - 32px);z-index:50}
.toast[hidden]{display:none}
@media(max-width:900px){
 :root{--gut:16px}
 body{padding-bottom:80px}
 .head{display:block}
 #players{margin-top:12px}
 .time{grid-template-columns:1fr;gap:6px}
 .time output{text-align:left}
 .key{display:block}
 .key .sp{margin-top:10px}
 .key .x{text-align:left;margin-top:10px}
 .grid{display:block}
 #reg{border-left:0;border-top:1px solid var(--i);padding-left:0;margin-top:28px;padding-top:0}
 .deb{display:block}
 .deb .hd.s{display:none}
 .deb .rl{padding-top:20px;border-top:1px solid var(--i)}
 .deb .col{border-left:0;padding-left:0;margin-left:0}
 .deb .colh{display:block}
 .map3,.focal .cols,.zones{display:block}
 .fields{gap:16px}
 .pb{display:none}
}
.deb .colh{display:none;font-family:var(--m);font-size:11px;color:var(--g);padding:10px 0 2px}
@media(max-width:900px){.deb .colh{display:block}}
@media(prefers-reduced-motion:no-preference){.card,.ridx button{transition:border-color .12s}}
</style>
</head>
<body>
<header class="top">
 <div><span class="mark">reraise</span><span class="pb">Powered by Private Executive</span></div>
 <button class="btn" id="theme" aria-label="Switch light or dark">Dark</button>
</header>
<nav class="fields" id="tabs" role="tablist" aria-label="Fields"></nav>
<section class="head"><h1 id="title"></h1><div id="players"></div></section>
<div class="time" id="time"></div>
<div id="key"></div>
<main class="grid">
 <div id="sheet"><div class="tools" id="tools"></div><div id="board"></div><svg class="lnk" id="lnk" aria-hidden="true"></svg></div>
 <aside id="reg" aria-label="Register"></aside>
</main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LN={P:{n:'Proven',d:'A source you can open stands behind this card, reproduced faithfully.'},S:{n:'Said',d:'Someone claims it. Who and where is named. Not checked.'},E:{n:'Experience',d:'Own experience. Needs no source.'}};
const MONTHS=['Oct 25','Nov 25','Dec 25','Jan 26','Feb 26','Mar 26','Apr 26','May 26','Jun 26','Jul 26','Aug 26','Sep 26','Oct 26'];
const GOLD=[4000,4120,4050,4210,4380,4300,4450,4520,4610,4580,4700,4820,4790];
let N=0;const cards=[];
function C(o){o.id='c'+(++N);o.n=N;o.conn=o.conn||[];cards.push(o);return o}
/* ---- fields ---- */
const fields={
 claim:{id:'claim',tab:'Claim',kind:'debate',title:'Vitamin D helps patients in hospital with COVID-19',players:[['You','human'],['A1 Research','agent'],['A2 Rebuttal','agent']],stops:['29 Aug 2020','17 Feb 2021','today'],t:2,question:'Does vitamin D help people in hospital with COVID-19?',
  log:[{id:'cm1',who:'A1',text:'laid 8 cards',t:1},{id:'cm2',who:'A2',text:'laid 7 cards',t:2}],
  rules:[{t:'Copies count once',s:'ap'},{t:'Only advertising as proof',s:'no'},{t:'Compare like with like',s:'ap'},{t:'Intent needs a document',s:'un'}],
  fire:[['You','Does vitamin D help people in hospital with COVID-19?'],['A1','I laid 8 cards. A trial in Córdoba: 1 of 50 treated needed intensive care, against 13 of 26 untreated. An MIT recalculation, three posts on the maker’s website and Michael Nehls point the same way. Two more cards say why the trials may differ.'],['A2','A trial in São Paulo found no reliable difference: a median of 7 days in hospital with vitamin D3, 7 days with placebo. And six of your eight cards go back to the same 76 patients in Córdoba. That is one origin, not six. I am laying 7 cards.']],
  chips:['Which origins are independent?','Ask A1 for a source on dose timing','Lay an experience card of mine'],
  rp:[[['A1','as the Córdoba team: 1 of 50 treated needed intensive care, 13 of 26 untreated.'],['A2','as the São Paulo team: 240 patients, placebo, 7 days against 7 days.']],[['A1','as the Córdoba team: our trial was open and had no placebo. It is a pilot.'],['A2','as the São Paulo team: then a pilot cannot settle it. The larger trial, 517 patients, has posted no results.']]],
  mod:['Evidence is mixed: a small pilot suggested benefit, a larger placebo trial did not.','No reliable benefit shown for high-dose D3 in hospital; calcifediol rests on one pilot.','Weight sits on the placebo-controlled trial.','Unclear: form of vitamin D and timing of the dose differ between trials.','Not established. Treat Córdoba as a hypothesis, not a finding.']},
 map:{id:'map',tab:'Map',kind:'map',title:'Strait of Hormuz',players:[['K','human'],['A1','agent'],['A2','agent'],['A3','agent']],stops:['Your assumption','Stage 1 · A1','Checked · A2'],t:2,question:'Will Iran close Hormuz permanently?',
  log:[{id:'mm1',who:'A1',text:'laid 6 actor cards with will, can, red line, and 2 sources',t:1},{id:'mm2',who:'A2',text:'checked an analyst transcript, laid 2 foreign cards',t:2}],
  rules:[{t:'Premise: geopolitics beats markets',s:'ap'},{t:'Never only foreign sources',s:'ap'},{t:'Red line first',s:'ap'},{t:'Alternative route',s:'un'}],
  fire:[['K','Lay everything up to the next stage on the board to test my assumption “Iran does not close Hormuz permanently”.'],['A1','Done: 6 actor cards with will/can/red line, plus 2 sources. I did not touch your assumption.'],['A2','Checked an analyst transcript, laid 2 foreign cards. One deviates from your assumption.'],['K','My assumption stands. I set my stance on it.'],['A1','Suggest stage 2 with insurers and alternative routes?']],
  chips:['Yes, start stage 2','Ask A3 to play Iran','What would Iran do next?'],
  rp:[[['A1','as USA: tanker escort. As Israel: warns Iran covertly.'],['A2','as Iran: stops a tanker. As Russia: supports the price via cuts.'],['A3','as China: offers mediation. As Saudi Arabia: raises output.']],[['A3','Round 2 needs your move. Choose a response to a stopped tanker.']]],
  mod:['A permanent closure would cut Iran’s own oil income; temporary disruption is likelier.','Closure threats are frequent; a sustained closure is rare.','It depends on whether the regime sees itself in existential danger, its red line.','Navies and insurers respond within days; a closure would not hold.','Cannot be forecast from public sources. Watch escort and insurance moves.']},
 market:{id:'market',tab:'Market',kind:'market',title:'Gold',players:[['You','human'],['A1','agent'],['A2','agent']],stops:MONTHS,t:12,question:'Where does gold go next?',zones:['Demand','Supply','Macro'],
  log:[{id:'gm1',who:'A1',text:'laid 3 flags on the price line',t:4},{id:'gm2',who:'A2',text:'laid 2 flags on the price line',t:11}],
  rules:[{t:'Flows beat opinions',s:'ap'},{t:'One analyst is not a trend',s:'ap'},{t:'Geopolitics premium',s:'un'}],
  fire:[['You','Where does gold go next? Lay what moved the price since last October.'],['A1','Laid 3 flags: central banks keep buying, record ETF inflows, flat mine output. Each has a source.'],['A2','Laid 2 more: an analyst target of 5000 by summer, and Hormuz tension in July. The target is one voice, not a trend.']],
  chips:['Open the Hormuz field','Which flags have a source?','Lay a jewellery card'],
  rp:[[['A1','as the demand side: central banks keep buying, ETF inflows are at a record.'],['A2','as the supply side: mine output is flat.']],[['A1','as the macro side: Hormuz tension adds a premium. Whether it stays is open.']]],
  mod:['Central bank buying and ETF flows carry the price; the trend is intact.','A single analyst target is a forecast, not a trend.','A geopolitical premium can reverse quickly.','Real rates are the main driver to watch.','Flat mine output supports the price; demand matters more.']}

  return `<div class="rh">Ping a knowledge card</div><div class="rs">Search your own and shared knowledge. Pick a card to bring it onto this board.</div><input id="ps" type="search" placeholder="Search cards" aria-label="Search knowledge cards" autocomplete="off"><div id="pr">${pingList('')}</div>`;
 }
 if(S.reg==='member'){
  const mine=cards.filter(c=>c.user&&c.layer==='P').length;
  return `<div class="rh">Membership</div><div class="rs">Numbers are given in order of joining.</div>
  <table class="tbl"><tr><th>No.</th><th>Member</th><th>Works on</th></tr>${members.map(m=>`<tr><td class="mono">${m[0]}</td><td>${m[1]}</td><td class="g">${esc(m[2])}</td></tr>`).join('')}</table>
  <div class="rh">Your standing #1</div><div class="rs">Built from cards with a source, takes by others and origin points. It is a reputation, not a verdict on any claim.</div>
  <table class="tbl"><tr><td>Cards with a source</td><td class="r big" style="font-size:24px">${S.base.proven+mine}</td></tr><tr><td>Your cards taken by others</td><td class="r big" style="font-size:24px">${S.base.taken}</td></tr><tr><td>Origin points</td><td class="r big" style="font-size:24px">${S.base.origin}</td></tr><tr><td>Cards you took</td><td class="r big" style="font-size:24px">${S.tookN}</td></tr></table>
  <div class="rh">Plan</div>
  <table class="tbl"><tr><td><b>Board</b></td><td class="r">Free</td></tr><tr><td><b>Exchange</b><br><span class="g">Optional. Trade and ping shared cards.</span></td><td class="r"><button class="lk" data-act="exch" aria-pressed="${S.exchange}">${S.exchange?'Joined':'Join'}</button></td></tr><tr><td><b>Premium</b><br><span class="g">Private Executive, set up from the start.</span></td><td class="r">Included</td></tr></table>`;
 }
 if(S.reg==='comm'){
  return `<div class="rh">Community</div><div class="rs">Other members and their boards. The wiki is made of cards members traded.</div>
  <table class="tbl"><tr><th>Member</th><th>Board</th></tr>${members.slice(1).map(m=>`<tr><td>${m[0]} ${m[1]}</td><td>${esc(m[2])}</td></tr>`).join('')}</table>
  <div class="rh">Shared wiki</div><div class="rs">Each entry names its origin and how often it was taken.</div>
  ${wiki.concat(S.deck.map(d=>({t:d.text,o:d.by,n:1}))).map(w=>`<div class="og"><span>${esc(w.t)}<br><span class="cm">Origin ${esc(w.o)}</span></span><span class="mono">taken ×${w.n}</span></div>`).join('')}`;
 }
 if(S.reg==='models'){
  return `<div class="rh">5 AI models say</div><div class="rs">Question: ${esc(f.question)}<br>A separate layer. Not a verdict of the board.</div>`+f.mod.map((m,i)=>`<div class="mod"><span class="w">Model ${i+1}</span><span>${esc(m)}<button data-act="modcard" data-v="${i}">Lay as a Said card</button></span></div>`).join('');
 }
 return '';
}
function pingList(q){
 q=q.toLowerCase();
 const pool=know.concat(cards.filter(c=>c.f!==S.f).map(c=>({text:c.text,layer:c.layer,body:c.body||'',by:c.by,src:c.src})));
 const r=pool.filter(k=>!q||(k.text+' '+k.body).toLowerCase().includes(q));
 return r.length?r.slice(0,12).map((k,i)=>{const gi=pool.indexOf(k);return `<div class="tr"><span class="ly ${k.layer}">${LN[k.layer].n}</span><h4 style="font-weight:500;font-size:15px;margin-top:4px">${esc(k.text)}</h4><div class="cm">${esc(k.by)}</div><div class="row"><span></span><button class="act" data-act="pingadd" data-v="${gi}">Bring to board</button></div></div>`}).join(''):'<div class="empty">No card matches. Try a shorter word.</div>';
}
function pingPool(){return know.concat(cards.filter(c=>c.f!==S.f).map(c=>({text:c.text,layer:c.layer,body:c.body||'',by:c.by,src:c.src})))}
/* ---- connections overlay ---- */
function drawLines(){
 const svg=$('#lnk'),sh=$('#sheet');
 svg.setAttribute('width',sh.offsetWidth);svg.setAttribute('height',sh.offsetHeight);
 if(!S.lines){svg.innerHTML='';return}
 const sr=sh.getBoundingClientRect(),V=vc(),D={supports:'',refutes:'6 4','depends on':'1 3',masks:'10 3 2 3'};
 let s='';
 const R=id=>{const e=sh.querySelector(`[data-id="${id}"]`);if(!e)return null;const r=e.getBoundingClientRect();return{l:r.left-sr.left,r:r.right-sr.left,t:r.top-sr.top,b:r.bottom-sr.top,w:r.width}};
 V.forEach(c=>c.conn.forEach(k=>{
  const a=R(c.id),b=R(k.to);if(!a||!b||!vis(byId(k.to)))return;
  const ay=a.t+14,by=b.t+14;let p;
  if(Math.abs(a.l-b.l)<20){const x=a.l-5;p=`M${a.l},${ay}H${x}V${by}H${b.l}`}
  else if(a.l<b.l){p=`M${a.r},${ay}H${(a.r+b.l)/2}V${by}H${b.l}`}
  else{p=`M${a.l},${ay}H${(a.l+b.r)/2}V${by}H${b.r}`}
  const dim=S.sel&&S.sel!==c.id&&S.sel!==k.to?.25:1;
  const hot=S.sel&&(S.sel===c.id||S.sel===k.to);
  s+=`<path d="${p}" fill="none" stroke="${hot?'var(--a)':'var(--i)'}" stroke-width="1" ${D[k.type]?`stroke-dasharray="${D[k.type]}"`:''} opacity="${dim}"/>`;
 }));
 svg.innerHTML=s;
}
function render(){renderTabs();renderHead();renderKey();renderTools();renderBoard();renderReg();requestAnimationFrame(drawLines)}
/* ---- dialogs ---- */
const dlg=$('#dlg');
function show(h){dlg.innerHTML=h;if(!dlg.open)dlg.showModal()}
function closeD(){if(dlg.open)dlg.close()}
function openCard(id,keep){
 const c=byId(id);if(!c)return;S.sel=id;
 const inc=cards.filter(x=>x.conn.some(k=>k.to===id)).map(x=>[x,x.conn.find(k=>k.to===id).type]);
 const outc=c.conn.map(k=>[byId(k.to),k.type]);
 const others=cards.filter(x=>x.f===c.f&&x.id!==id&&vis(x));
 const mine=c.by==='You'||c.by==='K'||c.user;
 const connList=outc.concat(inc.map(i=>[i[0],'is '+(i[1]==='depends on'?'depended on':i[1]==='refutes'?'refuted':i[1]==='supports'?'supported':i[1])+' by'])).map(e=>`<button class="lk" data-act="card" data-id="${e[0].id}">${esc(typeof e[1]==='string'&&e[1].startsWith('is ')?e[1]:e[1])} C${e[0].n} ${esc(e[0].text)}</button>`).join('<br>')||'None yet.';
 const a=c.actor;
 const taken=S.deck.some(d=>d.id===id);
 show(`<div class="dl"><div class="dh"><span class="ly ${c.layer}">${LN[c.layer].n}</span><span><span class="cn">C${c.n}</span> <button class="lk" data-act="close" style="margin-left:14px">Close</button></span></div>
 <h2>${esc(c.text)}</h2>${c.body?`<div class="body">${esc(c.body)}</div>`:''}
 ${a?`<dl style="margin-bottom:8px"><dt>Will</dt><dd>${esc(a.will)}</dd><dt>Can</dt><dd>${esc(a.can)}</dd><dt>Red line</dt><dd>${esc(a.red)}</dd><dt>Next (estimate)</dt><dd><i>${esc(a.next)}</i></dd></dl>`:''}
 <dl><dt>Layer</dt><dd>${LN[c.layer].d}</dd>
 <dt>${c.layer==='S'?'Said by':'Source'}</dt><dd>${c.src?(c.layer==='P'?`<button class="lk" data-act="src" data-v="${esc(c.src)}">${esc(c.src)}</button><div id="srcn" class="note"></div>`:esc(c.src)):'None needed.'}</dd>
 <dt>Laid by</dt><dd>${esc(c.by)}${c.foreign?', foreign source':''}</dd>
 <dt>Origin</dt><dd>${esc(c.origin||c.by)}</dd>
 <dt>Connections</dt><dd>${connList}</dd></dl>
 <div class="acts"><button class="act ${taken?'':'pri'}" data-act="take" data-v="${id}" ${taken?'disabled':''}>${taken?'Taken':'Take'}</button>
 <button class="act" data-act="stance" data-v="${id}">${S.stance[id]?'★ My stance set. Clear':'☆ Set my stance'}</button>
 ${mine&&S.exchange&&c.layer!=='S'?`<button class="act" data-act="offer" data-v="${id}">Offer to the exchange</button>`:''}
 ${c.link?`<button class="act" data-act="field" data-v="${c.link}" data-close="1">Open field Map</button>`:''}</div>
 <div class="note">Take copies the card into your deck. The origin stays with ${esc(c.by)}. My stance is private, only you can set it, and it does not travel with the card.</div>
 <div class="conn"><span>Draw a connection from this card:</span><select id="ct" aria-label="Type"><option>supports</option><option>refutes</option><option>depends on</option><option>masks</option></select><select id="cx" aria-label="Target card">${others.map(o=>`<option value="${o.id}">C${o.n} ${esc(o.text.slice(0,34))}</option>`).join('')}</select><button class="act" data-act="draw" data-v="${id}">Draw</button></div></div>`);
 renderBoard();requestAnimationFrame(drawLines);
}
function openLay(p){
 p=p||{};const f=F();
 let place='';
 if(f.kind==='debate')place=`<label for="ls">Side</label><select id="ls"><option value="sup" ${p.side==='sup'?'selected':''}>Supports</option><option value="ref" ${p.side==='ref'?'selected':''}>Refutes</option></select>`;
 else if(f.kind==='map')place=`<label for="ls">Place at the focal point</label><select id="ls"><option value="sup">Supports</option><option value="ref">Refutes</option></select>`;
 else place=`<label for="ls">Zone</label><select id="ls">${f.zones.map(z=>`<option ${p.zone===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`+(f.kind==='market'?`<label for="lm">Pin a flag to the price line at</label><select id="lm"><option value="">No flag</option>${MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select>`:'');
 show(`<form class="dl fm" data-act="laysave"><div class="dh"><b>Lay a card</b><button type="button" class="lk" data-act="close">Close</button></div>
 <label for="lt">Statement</label><textarea id="lt" required maxlength="220">${esc(p.text||'')}</textarea>
 <label>Layer</label><div class="rad"><label><input type="radio" name="ly" value="P"> <span class="ly P">Proven</span></label><label><input type="radio" name="ly" value="S" ${p.layer!=='E'?'checked':''}> <span class="ly S">Said</span></label><label><input type="radio" name="ly" value="E" ${p.layer==='E'?'checked':''}> <span class="ly E">Experience</span></label></div>
 <label for="lsrc" id="lsl">Who said it, and where</label><input id="lsrc" type="text" autocomplete="off">
 ${place}
 <div class="note" id="lnote">Said: someone claims it. Name them.</div>
 <div class="acts"><button class="act pri" type="submit">Lay card</button><button type="button" class="act" data-act="close">Cancel</button></div></form>`);
 const upd=()=>{const v=dlg.querySelector('input[name=ly]:checked').value;const l=$('#lsl'),i=$('#lsrc');
  l.textContent=v==='P'?'Source (required): a document that can be opened':v==='S'?'Who said it, and where':'Source (not needed)';
  i.disabled=v==='E';i.required=v!=='E';$('#lnote').textContent=v==='P'?'Proven: the source stands behind the card and is reproduced faithfully.':v==='S'?'Said: someone claims it. Name them.':'Experience: your own. No source needed.';
  if(v==='E')i.value=''};
 dlg.querySelectorAll('input[name=ly]').forEach(r=>r.onchange=upd);upd();
}
function openNew(){
 show(`<form class="dl fm" data-act="newsave"><div class="dh"><b>+ New field</b><button type="button" class="lk" data-act="close">Close</button></div>
 <div class="note">We build the kit, you build the field. Four choices, top to bottom.</div>
 <div class="step"><label for="nn">Name</label><input id="nn" type="text" required maxlength="60" placeholder="e.g. Should we hire in March?" autocomplete="off"></div>
 <div class="step"><label for="ng">1 Ground: what the field is laid on</label><select id="ng"><option value="debate">Debate: two sides, rows by layer</option><option value="map">Map: actors with will, can, red line</option><option value="market">Market: price line above, board below</option><option value="blank">Blank sheet</option></select></div>
 <div class="step"><label for="nz">2 Zones: where cards go, separated by commas</label><input id="nz" type="text" value="Supports, Refutes" autocomplete="off"></div>
 <div class="step"><label for="ns">3 Seats: roles at the table, separated by commas</label><input id="ns" type="text" value="You, Research, Rebuttal" autocomplete="off"></div>
 <div class="step"><label>4 Who moves: per seat</label><div id="nw"></div></div>
 <div class="acts"><button class="act pri" type="submit">Create field</button><button type="button" class="act" data-act="close">Cancel</button></div></form>`);
 const seats=()=>{const v=$('#ns').value.split(',').map(x=>x.trim()).filter(Boolean);$('#nw').innerHTML=v.map((s,i)=>`<div class="seat"><span>${esc(s)}</span><select data-seat="${i}"><option>human</option><option ${i>0?'selected':''}>agent</option><option>model</option></select></div>`).join('')};
 $('#ns').oninput=seats;seats();
 $('#ng').onchange=()=>{const z={debate:'Supports, Refutes',map:'Actors, Focal point, Sources',market:'Demand, Supply, Macro',blank:'Ideas, Questions'};$('#nz').value=z[$('#ng').value]};
}
/* ---- actions ---- */
function addLog(who,text){const f=F();f.log.push({id:'u'+Date.now()+Math.random().toString(36).slice(2,5),who,text,t:f.t})}
const actions={
 field(t){S.f=t.dataset.v;S.sel=null;if(t.dataset.close)closeD();render();window.scrollTo(0,0)},
 newfield(){openNew()},
 key(){S.key=!S.key;renderKey()},
 lines(){S.lines=!S.lines;renderTools();drawLines()},
 reg(t){S.reg=t.dataset.v;renderReg()},
 card(t){openCard(t.dataset.id)},
 close(){closeD()},
 lay(t){openLay({layer:t.dataset.layer,side:t.dataset.side,zone:t.dataset.zone,text:t.dataset.text})},
 chip(t){sendMsg(t.dataset.v)},
 rp(){S.rp=!S.rp;renderReg()},
 round(){const f=F(),r=f.rp[S.rpn];S.rpn++;
  if(r)r.forEach(m=>f.fire.push([m[0],'Round '+S.rpn+', '+m[1]]));
  else f.fire.push([f.players[1][0].split(' ')[0],'No further round is prepared. Make your move in the fireside.']);
  renderReg()},
 rule(t){const r=F().rules[+t.dataset.v];r.s=r.s==='ap'?'no':r.s==='no'?'un':'ap';renderReg()},
 undo(t){const l=F().log.find(x=>x.id===t.dataset.v);l.undone=!l.undone;toast(l.undone?'Taken back: '+l.who+' '+l.text:'Restored: '+l.who+' '+l.text);renderBoard();renderReg();requestAnimationFrame(drawLines)},
 takeoffer(t){const o=offers.find(x=>x.id===t.dataset.v);S.taken[o.id]=1;S.deck.push({id:o.id,text:o.text,layer:o.layer,by:o.by,body:o.body,src:o.src});S.tookN++;toast('Taken. Origin stays with '+o.by+'.');renderReg()},
 openoffer(t){const o=offers.find(x=>x.id===t.dataset.v);show(`<div class="dl"><div class="dh"><span class="ly ${o.layer}">${LN[o.layer].n}</span><button class="lk" data-act="close">Close</button></div><h2>${esc(o.text)}</h2><div class="body">${esc(o.body)}</div><dl><dt>Origin</dt><dd>${esc(o.by)}</dd><dt>${o.layer==='S'?'Said by':'Source'}</dt><dd>${esc(o.src||'None needed.')}</dd><dt>Wants</dt><dd>${esc(o.want)}</dd></dl><div class="acts">${S.taken[o.id]?'<button class="act" disabled>Taken</button>':`<button class="act pri" data-act="takeoffer" data-v="${o.id}" data-close="1">Take</button>`}</div></div>`)},
 'lay-deck'(t){const d=S.deck[+t.dataset.v],f=F();
  const c=C({f:f.id,layer:d.layer,t:f.t,by:d.by,text:d.text,body:d.body,src:d.src,origin:d.by,user:1,side:'sup',zone:f.zones&&f.zones[0]});
  if(f.kind==='market')c.zone=f.zones[2];addLog('You','laid 1 card from the exchange');toast('Laid on this board. Origin stays with '+d.by+'.');render()},
 pingadd(t){const k=pingPool()[+t.dataset.v],f=F();
  const c=C({f:f.id,layer:k.layer,t:f.t,by:k.by,text:k.text,body:k.body,src:k.src,origin:k.by,user:1,side:'sup',zone:f.zones&&f.zones[0]});
  addLog('You','pinged 1 card onto the board');toast('Brought to the board: '+k.text);render()},
 exch(){S.exchange=!S.exchange;renderReg()},
 modcard(t){const f=F(),i=+t.dataset.v;
  C({f:f.id,layer:'S',t:f.t,by:'Model '+(i+1),text:f.mod[i],src:'Model '+(i+1)+', answer to “'+f.question+'”',origin:'Model '+(i+1),user:1,side:f.kind==='map'?'sup':'sup',zone:f.zones&&f.zones[f.zones.length-1]});
  addLog('You','laid a model answer as a Said card');toast('Laid as a Said card. Models stay a separate layer until you lay one.');render()},
 src(t){const n=$('#srcn');if(n)n.textContent='Opens the cited document: '+t.dataset.v+'. The card reproduces it as written.'},
 take(t){const c=byId(t.dataset.v);if(S.deck.some(d=>d.id===c.id))return;S.deck.push({id:c.id,text:c.text,layer:c.layer,by:c.by,body:c.body,src:c.src});S.tookN++;toast('Taken into your deck. Origin stays with '+c.by+'.');openCard(c.id);renderReg()},
 stance(t){const id=t.dataset.v;if(S.stance[id])delete S.stance[id];else S.stance[id]=true;openCard(id);toast(S.stance[id]?'Stance set. Private to you.':'Stance cleared.')},
 offer(t){const id=t.dataset.v;if(!S.offerMine.includes(id))S.offerMine.push(id);toast('Offered. Origin stays with you.');S.reg='trade';renderReg();closeD()},
 draw(t){const c=byId(t.dataset.v),to=$('#cx').value;if(!to)return;const ty=$('#ct').value;if(!c.conn.some(k=>k.to===to&&k.type===ty))c.conn.push({type:ty,to});addLog('You','drew '+ty+' from C'+c.n+' to C'+byId(to).n);toast('Connection drawn: C'+c.n+' '+ty+' C'+byId(to).n);openCard(c.id);renderReg()}
};
function sendMsg(txt){
 txt=(txt||'').trim();if(!txt)return;const f=F(),me=f.players[0][0];
 const to=($('#to')||{}).value||'A1';
 f.fire.push([me,'To '+to+': '+txt]);
 const reply=to==='A2'||to==='A2'?'I will test it against the opposing cards and report here before I lay anything.':to==='A3'?'I will play it from the actor’s side and report here.':'Understood. I will look for a source and report here before I lay anything.';
 renderReg();
 setTimeout(()=>{f.fire.push([to,reply]);if(S.reg==='fire'&&F()===f)renderReg()},350);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.tagName==='FORM')return;
 if(t.tagName==='SELECT'||t.tagName==='INPUT')return;
 const a=t.dataset.act;if(actions[a]){actions[a](t);if(t.dataset.close&&a!=='field')closeD()}
});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act=card]:not(button)')){e.preventDefault();openCard(e.target.closest('[data-id]').dataset.id)}
});
document.addEventListener('input',e=>{
 if(e.target.id==='tr'){F().t=+e.target.value;tout();renderBoard();renderReg();requestAnimationFrame(drawLines)}
 if(e.target.id==='ps'){$('#pr').innerHTML=pingList(e.target.value)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const a=e.target.dataset.act,f=F();
 if(a==='send'){const i=$('#fi');sendMsg(i.value);return}
 if(a==='addrule'){const v=$('#nr').value.trim();if(v){f.rules.push({t:v,s:'un'});renderReg()}return}
 if(a==='laysave'){
  const ly=dlg.querySelector('input[name=ly]:checked').value,sel=$('#ls').value,m=$('#lm')&&$('#lm').value;
  const t=Math.max(f.t,m?+m:0);
  const c=C({f:f.id,layer:ly,t,by:f.players[0][0],text:$('#lt').value.trim(),src:$('#lsrc').value.trim(),origin:'You',user:1,side:f.kind==='zones'||f.kind==='market'?undefined:sel,zone:f.kind==='debate'||f.kind==='map'?undefined:sel,m:m?+m:undefined});
  if(c.m==null)delete c.m;
  if(f.kind==='market'&&c.m!=null){c.move=undefined}
  f.t=t;addLog(f.players[0][0],'laid 1 card');S.sel=c.id;closeD();render();toast('Card laid: C'+c.n);return}
 if(a==='newsave'){
  const g=$('#ng').value,zs=$('#nz').value.split(',').map(x=>x.trim()).filter(Boolean),ss=$('#ns').value.split(',').map(x=>x.trim()).filter(Boolean);
  const mv=[...dlg.querySelectorAll('[data-seat]')].map(s=>s.value);
  const id='f'+Date.now(),name=$('#nn').value.trim();
  fields[id]={id,tab:name.length>14?name.slice(0,13)+'…':name,kind:'zones',title:name,ground:g,players:ss.map((s,i)=>[s,mv[i]||'agent']),stops:['now'],t:0,question:name,zones:zs.length?zs:['Cards'],log:[],rules:[],fire:[[ss[0]||'You','Field created on a '+({debate:'debate',map:'map',market:'market',blank:'blank'}[g])+' ground with '+(zs.length||1)+' zones.']],chips:['Lay the first card'],rp:[],mod:['Not asked yet for this field.','','','','']};
  fields[id].mod=['Ask the five models once the first cards are laid.','','','',''];
  S.f=id;S.sel=null;closeD();render();toast('Field created. Lay the first card in a zone.');return}
});
$('#dlg').addEventListener('close',()=>{S.sel=null;renderBoard();requestAnimationFrame(drawLines)});
dlg.addEventListener('click',e=>{if(e.target===dlg)closeD()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(F().kind==='market')chart();drawLines()},120)});
/* theme */
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;return d}
$('#theme').onclick=()=>{const d=theme();document.documentElement.dataset.theme=d?'light':'dark';$('#theme').textContent=d?'Dark':'Light';if(F().kind==='market')chart();drawLines()};
$('#theme').textContent=theme()?'Light':'Dark';
render();
</script>
