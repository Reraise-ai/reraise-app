input[type=text],input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--mut);border-radius:10px;background:var(--sf)}

.side{display:flex;flex-direction:column;gap:16px}
.banner{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

dialog{border:0;border-radius:16px;padding:0;background:var(--sf);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}

.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 8px;position:sticky;top:0;background:var(--sf)}

#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}

body[data-level="1"] .l1f,body[data-level="2"] .l1f{display:inline-flex}

@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.tools{grid-template-columns:1fr}.zones{grid-template-columns:1fr}.mapgrid{grid-template-columns:1fr}.focal .three{grid-template-columns:1fr}}

 if(f.type==='market'){const m=f.time;const pts=PRICE.map((p,i)=>[44+i*35,176-(p-3900)/1000*160]);

  const zn=f.zones.map(z=>{const a=cs.filter(c=>c.side===z[0]);return `<section class="col" aria-label="${z[0]}"><h3>${z[0]}</h3><p class="sub">${z[1]}</p>${a.length?a.map(c=>cardHTML(c,f)).join(''):'<div class="empty">No card in this zone at this date.</div>'}</section>`}).join('');
  return `<p class="sub"><b>${MONTHS[m]}: ${PRICE[m].toLocaleString('en-US')} USD/oz</b> · sample series. Each flag is a card; click it to open.</p>${svg}<div class="flags">${flags||'<div class="empty">No flags yet at this date.</div>'}</div><div class="zones">${zn}</div>`}

 if(f.type==='market')c.fl=f.cards.filter(x=>x.fl).length+1,c.t=f.time;
 f.cards.push(c);f.log.unshift({id:'mm'+id,who:me,text:me+' laid 1 card',cards:[id]});$('#dlg').close();renderStage();renderSide();toast('Card laid. It is in the move log; you can take it back.')}
function pingD(q=''){const f=F();const all=[];Object.values(S.fields).forEach(x=>x.cards.filter(c=>c.layer&&!c.will).forEach(c=>all.push({text:c.text,layer:c.layer,from:x.name==='Field'?x.title:x.type==='claim'?'Claim':x.type==='map'?'Map':'Market',src:c.src,who:c.who})));
 S.deck.forEach(d=>all.push({text:d.text,layer:d.layer,from:'My deck',src:d.src,who:d.who}));
 const rs=all.filter(a=>a.text.toLowerCase().includes(q.toLowerCase()));
 return `<p class="sub">Search your own and shared knowledge, then bring a card onto this board.</p><label class="f" for="pq">Search knowledge cards</label><input type="search" id="pq" value="${esc(q)}" placeholder="e.g. insurance, trial, banks"><ul class="lst" id="pres">${rs.length?rs.map((a,i)=>`<li><div><b>${esc(a.text)}</b><br><span class="help">${LAYER[a.layer][0]} · from ${esc(a.from)}</span></div><button class="btn sm" data-act="bring" data-text="${esc(a.text)}" data-layer="${a.layer}" data-src="${esc(a.src||a.who||'')}">Bring to board</button></li>`).join(''):'<li><div>No card matches. Try another word, or lay a new card.</div></li>'}</ul>`}
function exchD(tab){const offers=S.offers.filter(o=>!S.taken[o.id]);
 const takeH=`<p class="sub">Cards other members offer. The origin stays with the author, always.</p><ul class="lst">${offers.length?offers.map(o=>`<li><div><b>${esc(o.text)}</b><br><span class="help">${LAYER[o.layer][0]} · origin: ${esc(o.author)} · offered by ${o.from}</span></div><button class="btn sm" data-act="takeoffer" data-id="${o.id}">Take</button></li>`).join(''):'<li><div>Nothing on offer right now.</div></li>'}</ul>`;
 const offH=`<p class="sub">Offer a card from your deck. Others can take it; your name stays on it as origin.</p><label class="f" for="od">Card to offer</label><select id="od">${S.deck.map((d,i)=>`<option value="${i}">${esc(d.text)}</option>`).join('')}</select><div class="dfoot"><button class="btn pri" data-act="offer">Offer this card</button></div><h3 class="grouph">Your open offers</h3><ul class="lst">${S.myOffers.length?S.myOffers.map(o=>`<li><div>${esc(o)}</div></li>`).join(''):'<li><div>None yet.</div></li>'}</ul>`;
 openD('Trade cards',`<div class="seg" role="group" aria-label="Trade view"><button data-act="exch" data-v="take" aria-pressed="${tab==='take'}">Take a card</button><button data-act="exch" data-v="offer" aria-pressed="${tab==='offer'}">Offer a card</button></div>`+(tab==='take'?takeH:offH))}
function modelsD(){const f=F();openD('5 AI models say',`<p class="sub"><b>Question:</b> ${esc(f.title)}. These are five model answers, shown apart from the board. <b>Not a verdict of the board.</b></p><ul class="lst">${f.models.map((m,i)=>`<li><div><b>Model ${i+1}</b><br>${esc(m)}</div><button class="btn sm" data-act="bring" data-text="${esc(m)}" data-layer="said" data-src="Model ${i+1}">Lay as Said card</button></li>`).join('')}</ul>`)}
function membersD(){openD('Membership',`<p class="sub">Members have numbers. Standing is earned from cards with a source, cards others take, and origin points.</p><ul class="lst"><li><div><b>#1 Kane</b> (you)<br><span class="help">Standing: 14 cards with source · 3 takes by others · 5 origin points</span></div></li><li><div><b>#2 Chris</b><br><span class="help">Standing: 4 cards with source · 1 take by others · 1 origin point</span></div></li><li><div><b>#3 Lena</b><br><span class="help">Standing: 2 cards with source · 0 takes by others · 0 origin points</span></div></li></ul><h3 class="grouph">What each level includes</h3><dl class="kv"><dt>Board</dt><dd>Free.</dd><dt>Exchange</dt><dd>Optional. Take and offer cards with other members.</dd><dt>Premium</dt><dd>Private Executive, set up from the factory.</dd></dl>`)}
function communityD(){const w=Object.keys(S.taken).map(id=>S.offers.find(o=>o.id===id)).filter(Boolean);openD('Community',`<h3 class="grouph">Other boards</h3><ul class="lst"><li><div><b>Sleep and light</b><br><span class="help">Board of #2 Chris · Claim field</span></div></li><li><div><b>Wholesale prices</b><br><span class="help">Board of #3 Lena · Market field</span></div></li><li><div><b>Red lines in the Gulf</b><br><span class="help">Board of #4 · Map field</span></div></li></ul><h3 class="grouph">Shared wiki from traded cards</h3><ul class="lst">${[...w.map(o=>[o.text,o.layer,o.author]),['Tanker insurance got pricier','proven','A1'],['Central banks keep buying','proven','A1']].map(r=>`<li><div><b>${esc(r[0])}</b><br><span class="help">${LAYER[r[1]][0]} · origin: ${esc(r[2])}</span></div></li>`).join('')}</ul>`)}
function stanceD(){const f=F();const cs=f.cards.filter(c=>vis(f,c)&&c.layer);openD('My stance',`<p class="sub">Pick the one card you stand behind. Only you can set it. It is private and does not change any card.</p><ul class="lst">${cs.map(c=>`<li><div>${esc(c.text)}<br><span class="help">${badge(c)}</span></div><button class="btn sm" data-act="stance" data-id="${c.id}">${f.stance===c.id?'★ Remove':'☆ Set'}</button></li>`).join('')}</ul>`)}
function roleD(){const f=F();openD('Role play',`<p class="sub">Your agents speak as the parties on this board, round by round. Every line goes to the fireside and the move log.</p><ul class="lst">${f.roles.map(r=>`<li><div><b>${esc(r[0])}</b><br><span class="help">played by ${r[1]}</span></div></li>`).join('')}</ul><p><b>Round: ${f.round}</b> ${f.rp?'(running)':'(not started)'}</p><div class="dfoot"><button class="btn pri" data-act="rpround">${f.rp?'Play next round':'Start role play'}</button>${f.rp?'<button class="btn" data-act="rpend">End role play</button>':''}</div>`)}
const W={step:1,base:'Debate',zones:'Supports, Refutes',agents:2,mover:'human'};
function wizD(){const s=W.step;const bases={Debate:'Supports, Refutes',Map:'Actors, Focal point',Market:'Demand, Supply, Macro','Blank board':'Ideas, Evidence'};
 let b='';
 if(s===1)b=`<h3 class="grouph">Choose a base to start from</h3><div class="rad" role="radiogroup">${Object.keys(bases).map(k=>`<label><input type="radio" name="wb" value="${k}" ${W.base===k?'checked':''}><span><b>${k}</b><br><span class="help">${k==='Debate'?'Two sides, rows by layer':k==='Map'?'Actors with will, can, red line':k==='Market'?'A price line above, a board below':'Zones you name yourself'}</span></span></label>`).join('')}</div>`;
 if(s===2)b=`<label class="f" for="wz">Name your zones<span class="help"> Separate with commas.</span></label><input type="text" id="wz" value="${esc(W.zones)}">`;
 if(s===3)b=`<label class="f" for="wa">How many agents sit at the table?</label><select id="wa">${[0,1,2,3].map(n=>`<option ${W.agents===n?'selected':''}>${n}</option>`).join('')}</select><p class="help">You always sit at the table. Agents get names A1, A2, A3.</p>`;
 if(s===4)b=`<h3 class="grouph">Who makes the moves?</h3><div class="rad">${['human','agent','model'].map(k=>`<label><input type="radio" name="wm" value="${k}" ${W.mover===k?'checked':''}><span><b>${k}</b><br><span class="help">${k==='human'?'Only you lay cards':k==='agent'?'Your agents lay and connect':'Models answer in their own layer'}</span></span></label>`).join('')}</div>`;
 openD('New field',`<div class="steps" aria-label="Step ${s} of 4">${['Base','Zones','Seats','Moves'].map((n,i)=>`<i class="${i+1===s?'on':''}">${i+1}. ${n}</i>`).join('')}</div><p class="help">Step ${s} of 4</p>${b}<div class="dfoot">${s>1?'<button class="btn" data-act="wback">Back</button>':''}${s<4?'<button class="btn pri" data-act="wnext">Next</button>':'<button class="btn pri" data-act="wmake">Create field</button>'}</div>`);W.bases=bases}
/* events */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v,f=F();
 if(a==='close'){const d=t.closest('dialog');d.close();return}
 if(a==='theme'){const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark';renderCtl();return}
 if(a==='level'){S.level=+v;renderCtl();return}
 if(a==='field'){S.field=v;render();return}
 if(a==='hint'){S.hints[v]=1;renderStage();renderSide();return}
 if(a==='open'){const id=t.dataset.id;if(t.closest('dialog'))$('#dlg').scrollTop=0;openCard(id);return}
 if(a==='lay'){openLay({side:t.dataset.side,layer:t.dataset.layer});return}
 if(a==='bring'){openLay({text:t.dataset.text,layer:t.dataset.layer,src:t.dataset.src});return}
 if(a==='ping'){openD('Ping a knowledge card',pingD());return}
 if(a==='exch'){exchD(v);return}
 if(a==='models'){modelsD();return}if(a==='members'){membersD();return}if(a==='community'){communityD();return}
 if(a==='stancepick'){stanceD();return}if(a==='roleplay'){roleD();return}
 if(a==='goto'){const el=$(v==='rules'?'#rules':'#time');if(el){el.scrollIntoView({block:'center'});(v==='time'?$('#tr'):el.querySelector('button')).focus()}return}
 if(a==='newfield'){W.step=1;wizD();return}
 if(a==='wnext'){if(W.step===1){W.base=(document.querySelector('input[name=wb]:checked')||{}).value||W.base;W.zones=W.bases[W.base]}if(W.step===2)W.zones=$('#wz').value||W.zones;if(W.step===3)W.agents=+$('#wa').value;W.step++;wizD();return}
 if(a==='wback'){W.step--;wizD();return}
 if(a==='wmake'){W.mover=(document.querySelector('input[name=wm]:checked')||{}).value||W.mover;const id='x'+(++uid),z=W.zones.split(',').map(s=>s.trim()).filter(Boolean);
  S.fields[id]={id,name:W.base+' field',type:'custom',title:W.base+' field',players:['You',...['A1','A2','A3'].slice(0,W.agents)],moves:W.mover,time:0,stops:['Now'],stand:'A new empty field with the zones '+z.join(', ')+'. Lay the first card to begin.',zones:z,cards:[],links:[],rules:[],log:[],chat:[],chips:['Suggest a first card'],roles:[],models:['No question set yet, so there is nothing to compare.'],stance:null,round:0,rp:false};
  S.field=id;$('#dlg').close();render();toast('Field created. Lay the first card.');return}
 if(a==='rule'){const r=f.rules[+t.dataset.i];const o=['applies','no','unclear'];r[1]=o[(o.indexOf(r[1])+1)%3];renderSide();return}
 if(a==='back'){const m=f.log.find(x=>x.id===t.dataset.id);if(m.undone){m.undone=false;renderStage();renderSide();toast('Move restored.');return}
  confirmD('Take back this move?',`“${m.text}”: its cards leave the board. You can restore the move from the move log.`,'Take back',()=>{m.undone=true;renderStage();renderSide();toast('Move taken back.')});return}
 if(a==='take'){const c=byId(f,t.dataset.id);confirmD('Take this card into your deck?',`A copy joins your deck. The origin stays with ${c.by}${c.origin?' ('+c.origin+')':''}.`,'Take card',()=>{S.deck.push({cid:c.id,text:c.text,layer:c.layer||'said',from:c.by,src:c.src,who:c.who});S.taken[c.id]=1;toast('Card is in your deck.');openCard(c.id)});return}
 if(a==='takeoffer'){const o=S.offers.find(x=>x.id===t.dataset.id);confirmD('Take this card?',`“${o.text}” joins your deck. Origin stays with ${o.author}.`,'Take card',()=>{S.taken[o.id]=1;S.deck.push({text:o.text,layer:o.layer,from:o.author,src:o.src,who:o.who});toast('Card taken. Origin stays with '+o.author+'.');exchD('take')});return}
 if(a==='offer'){const d=S.deck[+$('#od').value];if(!d)return;confirmD('Offer this card?',`Others can take “${d.text}”. Your name stays on it as origin.`,'Offer card',()=>{S.myOffers.push(d.text);toast('Card offered.');exchD('offer')});return}
 if(a==='stance'){const id=t.dataset.id;f.stance=f.stance===id?null:id;renderStage();renderSide();toast(f.stance?'Stance set. Only you can see it.':'Stance removed.');if($('#dlg').open){if(t.closest('.lst'))stanceD();else openCard(id)}return}
 if(a==='connect'){const to=$('#lt').value,ty=$('#ltype').value;if(!to)return;f.links.push([t.dataset.id,to,ty]);toast('Connection drawn: '+ty+'.');openCard(t.dataset.id);return}
 if(a==='jump'){$('#dlg').close();S.field=v;render();return}
 if(a==='chip'){send('Everyone'===$('#to').value?f.players.find(p=>p.startsWith('A')):$('#to').value,v);return}
 if(a==='rpround'){f.rp=true;f.round++;f.roles.forEach(r=>f.chat.push([r[1]+' as '+r[0],r[2]]));f.log.unshift({id:'rp'+f.round,who:'Role play',text:'Role play round '+f.round,cards:[]});renderStage();renderSide();roleD();return}
 if(a==='rpend'){f.rp=false;renderStage();roleD();return}
});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
 if(id==='layf')layNow();
 if(id==='say'){const v=$('#sayin').value.trim();if(v)send($('#to').value,v)}
 if(id==='addrule'){const v=$('#rin').value.trim();if(v){F().rules.push([v,'unclear']);renderSide()}}});
document.addEventListener('input',e=>{if(e.target.id==='tr'){const f=F();f.time=+e.target.value;$('#tout').textContent=f.stops[f.time];e.target.setAttribute('aria-valuetext',f.stops[f.time]);$('#board').innerHTML=board(f);bump2()}
 if(e.target.id==='pq'){const p=e.target.selectionStart;$('#db').innerHTML=pingD(e.target.value);const q=$('#pq');q.focus();q.setSelectionRange(p,p)}});
function bump2(){if(!bump2.d){bump2.d=1}}
function send(to,text){const f=F(),me=f.players.includes('K')?'K':'You';const ag=to==='Everyone'?f.players.find(p=>p!=='You'&&p!=='K'):to;f.chat.push([me,text]);renderSide();
 const st=$('#status');if(ag){st.textContent=ag+' is working on it…';setTimeout(()=>{const r=ag.startsWith('A2')?'I will look for the strongest card against this and show where it comes from. Your cards stay as they are.':ag==='A3'?'I will check this from a third angle and report what I find, with sources.':'I will look for sources first, then lay cards you can open. Your cards stay as they are.';f.chat.push([ag,r]);renderSide();$('#status').textContent=ag+' answered.';const c=$('#chat');c.scrollTop=c.scrollHeight},700)}else{f.chat.push(['Board','No agent is at this table. Add one when you create a field.']);renderSide()}
 const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('g.fl')){e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key===' '&&e.target.matches('g.fl')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('change',e=>{});
render();
</script>
</body>
