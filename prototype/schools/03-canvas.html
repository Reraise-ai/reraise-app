<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>reraise board canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DFE5EA;--dot:#BAC4CD;--zone:#EEF2F5;--zline:#C5CFD8;--card:#FFFFFF;--ink:#16202B;--mut:#58656F;--line:#C6CFD7;
  --proven:#0B7A68;--said:#9A5B00;--exp:#5846C4;--model:#5B6670;
  --sup:#1F5FD0;--ref:#BE1E4E;--dep:#667487;
  --chrome:rgba(250,252,253,.9);--chromeline:#CBD3DA;--hl:#16202B;--onhl:#fff;--shadow:0 1px 2px rgba(18,28,38,.14),0 8px 22px rgba(18,28,38,.09);
  --a1:#0B7A68;--a2:#BE1E4E;--a3:#5846C4;--gold:#B07A10;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0D1116;--dot:#222B35;--zone:#141A21;--zline:#2A3541;--card:#1C242D;--ink:#E7ECF1;--mut:#94A2AE;--line:#33404D;
  --proven:#43C4AC;--said:#E3A84A;--exp:#A395FF;--model:#9AA7B3;--sup:#73A3FF;--ref:#FF7099;--dep:#8D9BAD;
  --chrome:rgba(22,29,36,.92);--chromeline:#35424F;--hl:#E7ECF1;--onhl:#0D1116;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
  --a1:#43C4AC;--a2:#FF7099;--a3:#A395FF;--gold:#E3B24A}}
:root[data-theme=dark]{
  --bg:#0D1116;--dot:#222B35;--zone:#141A21;--zline:#2A3541;--card:#1C242D;--ink:#E7ECF1;--mut:#94A2AE;--line:#33404D;
  --proven:#43C4AC;--said:#E3A84A;--exp:#A395FF;--model:#9AA7B3;--sup:#73A3FF;--ref:#FF7099;--dep:#8D9BAD;
  --chrome:rgba(22,29,36,.92);--chromeline:#35424F;--hl:#E7ECF1;--onhl:#0D1116;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
  --a1:#43C4AC;--a2:#FF7099;--a3:#A395FF;--gold:#E3B24A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-variation-settings:"wdth" 92;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sup);outline-offset:2px}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(circle,var(--dot) 1.4px,transparent 1.6px);background-size:32px 32px}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.zone{position:absolute;background:var(--zone);border:1px solid var(--zline);border-radius:34px}
.zone.cur{border-color:color-mix(in srgb,var(--ink) 38%,var(--zline))}
.zt{position:absolute;left:36px;top:26px;margin:0;font-weight:760;font-size:calc(35px*var(--k,1));line-height:1.04;font-variation-settings:"wdth" 76;letter-spacing:-.01em;max-width:1000px}
.zk{position:absolute;left:38px;top:calc(8px);font-size:calc(13px*var(--k,1));color:var(--mut);font-weight:600}
.zb{position:absolute;left:38px;top:84px;margin:0;font-size:15px;line-height:1.38;color:var(--mut);max-width:760px}
.zf{position:absolute;left:38px;bottom:20px;font-size:13px;color:var(--mut)}
.pills{position:absolute;display:flex;gap:8px}
.pill{border:1px solid var(--chromeline);background:var(--chrome);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.pill[aria-pressed=true]{background:var(--hl);color:var(--onhl);border-color:var(--hl)}
.band{position:absolute;border-radius:20px;background:color-mix(in srgb,var(--card) 42%,transparent);border:1px dashed var(--zline)}
.bl{position:absolute;font-size:13px;font-weight:600;color:var(--mut);display:flex;gap:6px;align-items:center}
.head{position:absolute;font-size:calc(22px*var(--k,1));font-weight:720;font-variation-settings:"wdth" 76}
.head.s{color:var(--sup)}.head.r{color:var(--ref)}
.empty{position:absolute;font-size:14px;color:var(--mut);font-style:italic}
.divider{position:absolute;width:0;border-left:1px dashed var(--zline)}
.qcard{position:absolute;width:400px;padding:12px 14px 13px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}
.qcard small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:3px}
.qcard span{font-size:17px;font-weight:600;line-height:1.25}
.qcard.hot{transform:scale(1.04);box-shadow:0 0 0 3px var(--sup),var(--shadow)}
.lens{position:absolute;width:62px;height:62px;border-radius:50%;cursor:grab;touch-action:none;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 70%,transparent);border:3px solid var(--model);box-shadow:var(--shadow);transition:left .35s,top .35s}
.lens.drag{transition:none;cursor:grabbing}
.lens svg{width:30px;height:30px;stroke:var(--model);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.lens::after{content:"5 models";position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap;pointer-events:none}
.ring{position:absolute;border:1px dashed var(--zline);border-radius:50%;pointer-events:none}
/* cards */
.card{position:absolute;padding:9px 12px 9px 13px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lc,var(--line));border-radius:11px;box-shadow:var(--shadow);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .3s,box-shadow .15s}
.card.proven{--lc:var(--proven)}.card.said{--lc:var(--said);border-left-style:dashed}.card.exp{--lc:var(--exp);border-left-style:dotted}.card.model{--lc:var(--model);border-left-style:double}
.card.topic{--lc:var(--dep);border-style:dashed;border-left-width:1px;box-shadow:none;background:transparent}
.card.jump{--lc:var(--sup)}
.card.drag{cursor:grabbing;box-shadow:0 14px 34px rgba(10,20,30,.28);z-index:5}
.card.sel{box-shadow:0 0 0 2px var(--ink),var(--shadow);z-index:4}
.card.target{box-shadow:0 0 0 3px var(--sup),var(--shadow)}
.card.gone{opacity:0;pointer-events:none}
.card.land{animation:land .6s ease-out}
@keyframes land{0%{transform:scale(.86);box-shadow:0 0 0 0 var(--sup)}40%{transform:scale(1.04);box-shadow:0 0 0 10px color-mix(in srgb,var(--sup) 25%,transparent)}100%{transform:scale(1)}}
.tag{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--lc,var(--mut))}
.tag svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tag .mo{margin-left:auto;color:var(--mut);font-weight:600}
.txt{margin:3px 0 5px;font-size:14.5px;line-height:1.3;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:12px;color:var(--mut)}
.meta b{color:var(--ink);font-weight:650}
.chip{border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:11.5px;color:var(--mut)}
.chip.warn{border-color:var(--ref);color:var(--ref)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:4px 0;font-size:13px}
.card dt{color:var(--mut)}.card dd{margin:0;font-weight:560}
.an{font-size:19px;font-weight:740;font-variation-settings:"wdth" 78;margin:2px 0 0}
.nx{margin-top:5px;padding:4px 7px;border:1px dashed var(--said);border-radius:7px;font-size:12.5px}
.nx b{color:var(--said);font-weight:650}
.rp{font-size:11.5px;font-weight:650;color:var(--onhl);background:var(--ink);border-radius:5px;padding:0 6px;display:none}
#world.roleplay-on .rp{display:inline-block}
.card.focal{border-width:2px;border-left-width:6px}
.card.focal .txt{font-size:18px;font-weight:700;font-variation-settings:"wdth" 80}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--card);opacity:0;transition:opacity .12s,transform .12s;cursor:crosshair;touch-action:none}
.dot::after{content:"";position:absolute;inset:-9px}
.dot[data-s=t]{left:calc(50% - 8px);top:-9px}.dot[data-s=b]{left:calc(50% - 8px);bottom:-9px}.dot[data-s=l]{top:calc(50% - 8px);left:-12px}.dot[data-s=r]{top:calc(50% - 8px);right:-9px}
.card:hover .dot,.card.sel .dot{opacity:1}.dot:hover{transform:scale(1.35)}
.star{position:absolute;right:-9px;top:-11px;width:25px;height:25px;border-radius:50%;background:var(--ink);color:var(--onhl);display:none;place-items:center;font-size:14px;line-height:1;box-shadow:var(--shadow)}
.card.stance .star{display:grid}
.deck{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--proven);display:none;place-items:center;box-shadow:var(--shadow)}
.deck svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.card.taken .deck{display:grid}
.world-far .meta,#world.far .meta,#world.far .txt+dl{display:none}
#world.far .card{font-size:1.5em}
#links path{fill:none;stroke-width:2.4;stroke-linecap:round}
.lk.sup{stroke:var(--sup)}.lk.ref{stroke:var(--ref);stroke-dasharray:8 6}.lk.dep{stroke:var(--dep);stroke-dasharray:1 6;stroke-width:3}.lk.msk{stroke:var(--dep);stroke-width:9;opacity:.3}
.lk.ctx{stroke:var(--dep);stroke-width:1.4;stroke-dasharray:1 5;opacity:.7}
.lk.pole{stroke:var(--gold);stroke-width:1.5;opacity:.8}
.ll{font-size:12px;font-weight:650;paint-order:stroke;stroke:var(--zone);stroke-width:4px;stroke-linejoin:round;fill:var(--mut);text-anchor:middle}
.ll.sup{fill:var(--sup)}.ll.ref{fill:var(--ref)}
#pv{stroke:var(--sup);stroke-width:3;fill:none;stroke-linecap:round}
.chart text{font-size:13px;fill:var(--mut)}
.chart .ax{stroke:var(--zline);stroke-width:1}
.chart .ln{fill:none;stroke:var(--gold);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.fut{stroke-dasharray:3 8;opacity:.45}
.chart .cur{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 4}
.chart .cv{font-size:15px;font-weight:700;fill:var(--ink)}
/* avatars */
.av{position:absolute;z-index:6;cursor:pointer;animation:drift 9s ease-in-out infinite;touch-action:none}
.av:nth-of-type(2n){animation-duration:11s;animation-delay:-3s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,9px)}}
.av .c{width:36px;height:36px;border-radius:50% 50% 50% 8px;background:var(--ac);color:#fff;font-weight:760;font-size:14px;display:grid;place-items:center;box-shadow:var(--shadow)}
.av.model .c{border-radius:8px}
:root[data-theme=dark] .av .c,:root:not([data-theme=light]) .av .c{color:#0D1116}
.av .nm{position:absolute;left:40px;top:-2px;font-size:12px;font-weight:700;color:var(--ac);white-space:nowrap}
.av .bub{position:absolute;left:42px;top:16px;width:210px;background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:6px 9px;font-size:12.5px;line-height:1.3;box-shadow:var(--shadow);color:var(--ink)}
.av.flip .bub{left:auto;right:42px;border-radius:12px 4px 12px 12px}.av.flip .nm{left:auto;right:40px}
.av .bub::after{content:"Open fireside";display:block;margin-top:3px;font-size:11.5px;color:var(--mut)}
#world.far .av .bub{display:none}
/* chrome */
.ui{position:fixed;z-index:20}
#brand{left:18px;top:12px;pointer-events:none}
#brand b{display:block;font-size:30px;line-height:1;font-weight:780;font-variation-settings:"wdth" 74;letter-spacing:-.02em}
#brand small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
#me{right:16px;top:12px}
#meBtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-weight:760;font-size:16px;box-shadow:var(--shadow)}
#menu{position:absolute;right:0;top:52px;width:292px;background:var(--chrome);backdrop-filter:blur(12px);border:1px solid var(--chromeline);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:none}
#menu.on{display:block}
#menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--chromeline);margin-bottom:6px}
#menu .who b{font-size:17px}#menu .who span{display:block;font-size:13px;color:var(--mut)}
.mi{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14.5px;font-weight:560}
.mi:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.mi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mi em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--mut)}
#mini{right:14px;bottom:14px;width:196px}
#minibtns{display:flex;gap:6px;justify-content:flex-end;margin-bottom:7px}
.mb{white-space:nowrap;border:1px solid var(--chromeline);background:var(--chrome);backdrop-filter:blur(10px);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:620;display:inline-flex;gap:6px;align-items:center}
.mb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mb[aria-pressed=true]{background:var(--hl);color:var(--onhl)}
#minimap{display:block;width:196px;height:128px;border:1px solid var(--chromeline);border-radius:12px;background:var(--chrome);backdrop-filter:blur(10px);touch-action:none;cursor:pointer}
#minimap text{font-size:9.5px;font-weight:650;fill:var(--mut)}
#minimap .tile{fill:var(--zone);stroke:var(--zline)}
#minimap .tile.cur{stroke:var(--ink);stroke-width:1.6}
#minimap .vw{fill:color-mix(in srgb,var(--sup) 14%,transparent);stroke:var(--sup);stroke-width:1.4}
#strip{left:14px;bottom:14px;width:min(430px,calc(100vw - 244px));background:var(--chrome);backdrop-filter:blur(12px);border:1px solid var(--chromeline);border-radius:14px;overflow:hidden}
#strip .bar{display:flex;gap:8px;align-items:center;padding:7px 8px 7px 12px;font-size:13.5px;min-height:46px}
#strip .bar .fn{font-weight:720;white-space:nowrap}
#strip .bar .lm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.sb{border:1px solid var(--chromeline);background:var(--card);border-radius:9px;padding:5px 10px;font-size:13px;font-weight:620;white-space:nowrap}
.sb:disabled{opacity:.4;cursor:default}
#mlist{max-height:0;overflow:auto;transition:max-height .25s;border-top:0 solid var(--chromeline)}
#strip.open #mlist{max-height:min(46vh,340px);border-top-width:1px}
.mv{display:flex;gap:8px;align-items:center;padding:7px 12px;font-size:13.5px;border-bottom:1px solid color-mix(in srgb,var(--chromeline) 60%,transparent)}
.mv .w{font-weight:700;min-width:26px}.mv .t{flex:1}
.mv.un .t{text-decoration:line-through;color:var(--mut)}
.mv .sb{padding:3px 8px;font-size:12.5px}
.ov{position:fixed;z-index:35;background:var(--chrome);backdrop-filter:blur(14px);border:1px solid var(--chromeline);box-shadow:var(--shadow);transition:transform .22s ease,opacity .22s}
#timeov{left:50%;top:0;width:min(640px,calc(100vw - 150px));transform:translate(-50%,-110%);border-radius:0 0 18px 18px;padding:12px 18px 12px;opacity:0;pointer-events:none}
#timeov.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#rulesov{left:0;top:84px;width:min(330px,88vw);max-height:calc(100vh - 190px);overflow:auto;transform:translateX(-104%);border-radius:0 18px 18px 0;padding:14px 16px;opacity:0;pointer-events:none}
#rulesov.on{transform:none;opacity:1;pointer-events:auto}
.grip{position:fixed;z-index:34;border:1px solid var(--chromeline);background:var(--chrome);color:var(--mut);display:grid;place-items:center;padding:0}
.grip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#gripT{left:50%;top:0;transform:translateX(-50%);width:54px;height:22px;border-top:0;border-radius:0 0 12px 12px}
#gripL{left:0;top:50%;width:22px;height:54px;border-left:0;border-radius:0 12px 12px 0;transform:translateY(-50%)}
.ov h3{margin:0 0 2px;font-size:16px;font-variation-settings:"wdth" 80}
.ov p.sub{margin:0 0 10px;font-size:13px;color:var(--mut)}
#tr{width:100%;accent-color:var(--ink);height:30px;margin:0}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ticks span.on{color:var(--ink);font-weight:700}
.tcap{font-size:13.5px;margin-top:6px;display:flex;gap:10px;align-items:center}
.rule{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--chromeline);background:var(--card);border-radius:11px;padding:9px 11px;margin-bottom:7px;font-size:14px;font-weight:560}
.rule .st{margin-left:auto;font-size:12.5px;font-weight:700;white-space:nowrap}
.rule .gl{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;color:#fff}
.rule.yes .gl{background:var(--proven)}.rule.no .gl{background:var(--ref)}.rule.unc .gl{background:transparent;border:2px dashed var(--mut);color:var(--mut)}.rule.pre .gl{background:var(--ink);color:var(--onhl)}
.rule.yes .st{color:var(--proven)}.rule.no .st{color:var(--ref)}.rule.unc .st{color:var(--mut)}
.addrule{display:flex;gap:6px;margin-top:4px}
.addrule input{flex:1;min-width:0;border:1px solid var(--chromeline);background:var(--card);border-radius:9px;padding:7px 9px;font-size:13.5px}
.orig{margin-top:12px;padding-top:10px;border-top:1px solid var(--chromeline);font-size:13.5px}
.orig .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* radial */
#radial{position:fixed;inset:0;z-index:30;pointer-events:none}
#radial button{position:absolute;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);display:grid;place-items:center;pointer-events:auto;box-shadow:var(--shadow);padding:0;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#radial button svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#radial button:hover,#radial button.act{background:var(--ink)}#radial button:hover svg,#radial button.act svg{stroke:var(--onhl)}
#radial button.stanceon svg{fill:var(--ink)}#radial button.stanceon:hover svg{fill:var(--onhl)}
#rtip{position:fixed;z-index:31;pointer-events:none;background:var(--ink);color:var(--onhl);padding:3px 9px;border-radius:7px;font-size:12.5px;font-weight:650;display:none;white-space:nowrap}
#tip{position:fixed;z-index:32;max-width:230px;background:var(--ink);color:var(--onhl);padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.3;display:none;box-shadow:var(--shadow)}
#hand{position:fixed;z-index:31;pointer-events:none;display:none;width:44px;height:44px}
#hand svg{width:44px;height:44px;fill:var(--card);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
#handcap{position:fixed;z-index:31;pointer-events:none;display:none;background:var(--ink);color:var(--onhl);border-radius:9px;padding:5px 10px;font-size:13px;font-weight:620}
/* popovers */
.pop{position:fixed;z-index:40;width:330px;max-width:calc(100vw - 20px);background:var(--card);border:1px solid var(--chromeline);border-radius:16px;box-shadow:0 20px 50px rgba(10,20,30,.28);padding:14px 15px 13px;display:none}
.pop.on{display:block;animation:rise .16s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:0}}
.pop h4{margin:0 0 4px;font-size:16.5px;line-height:1.28;font-weight:650}
.pop .x{position:absolute;right:8px;top:8px;border:0;background:none;width:30px;height:30px;font-size:20px;color:var(--mut)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:5px 8px;font-size:13.5px;margin:9px 0}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:560}
.cl{margin:6px 0 10px;padding:0;list-style:none}
.cl li{font-size:13.5px}

/* actions */
function addCardMove(fid,wx,wy,o,linkTo,type,who='You'){
  const f=fid;const c=Object.assign({id:'c'+(++cid),field:f.id,w:240,t:maxStage(f),hidden:true,by:who,x:wx,y:wy},o);
  cards.push(c);byId[c.id]=c;let l=null;
  if(linkTo&&type){l={id:'l'+(++lid),a:c.id,b:linkTo,type,by:who,hidden:true};links.push(l)}
  doMove(who,`laid “${short(c.text)}”`,f.id,()=>{c.hidden=false;if(l)l.hidden=false},()=>{c.hidden=true;if(l)l.hidden=true});
  const e=els[c.id];if(e){e.classList.add('land');setTimeout(()=>e.classList.remove('land'),700)}
  return c;
}
const short=t=>t.length>34?t.slice(0,32).replace(/\s\S*$/,'')+'…':t;
function fieldAt(wx,wy){let best=null,bd=1e12;F.forEach(f=>{const dx=Math.max(f.x-wx,0,wx-(f.x+f.w)),dy=Math.max(f.y-wy,0,wy-(f.y+f.h));const d=dx*dx+dy*dy;if(d<bd){bd=d;best=f}});return best}
function addLink(a,b,type){
  if(a===b)return;const f=fld(byId[a].field);if(!guard(f))return;
  const l={id:'l'+(++lid),a,b,type,by:'You',hidden:true};links.push(l);
  doMove('You',`drew ${type}: “${short(byId[a].text)}” → “${short(byId[b].text)}”`,f.id,()=>l.hidden=false,()=>l.hidden=true);
}
function take(id){const c=byId[id];if(isMe(c.by)&&!c.via){toast('That is your own card.');return}if(!guard(fld(c.field)))return;const was=c.taken;
  doMove('You',(was?'put back':'took')+` “${short(c.text)}” into your deck`,c.field,()=>c.taken=!was,()=>c.taken=was);
  if(!was)tipOnce('take','The card stays with its author. Your deck holds a copy of it, and the origin stays visible.',els[id])}
function stanceToggle(id){const c=byId[id];c.stance=!c.stance;sync();placeRadial();renderMenu();tipOnce('stance','Your star is private. Only you see it, agents do not, and it does not hang on the card for others.',els[id]);if(c.stance)toast('Stance set. Private to you.')}

}

const rp={};
function setRP(fid,on){

  if(on){const lines=Object.entries(f.roles).map(([k,v])=>`${k} plays ${v}`).join('. ');fire[fid].push({w:'A1',t:'Role play on. '+lines+'.'});if(fid==='map')cards.filter(c=>c.field==='map'&&c.kind==='actor').forEach(c=>{});updateBubbles();renderFire();toast('Role play on. '+lines+'.',3600)}

function closeTransient(){
  $('#pop').classList.remove('on');$('#composer').classList.remove('on');$('#chooser').classList.remove('on');$('#menu').classList.remove('on');$('#meBtn').setAttribute('aria-expanded','false');popFor=null;$('#tip').style.display='none';
}
function chooser(x,y,a,b){
  const c=$('#chooser');c.innerHTML=`<p>“${esc(short(byId[a].text))}” → “${esc(short(byId[b].text))}”</p><div class="btns"><button class="btn" data-t="supports" style="border-color:var(--sup);color:var(--sup)">supports</button><button class="btn" data-t="refutes" style="border-color:var(--ref);color:var(--ref)">refutes</button><button class="btn" data-t="">Cancel</button></div>`;

$('#chooser').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const c=$('#chooser');c.classList.remove('on');if(b.dataset.t){addLink(c.dataset.a,c.dataset.b,b.dataset.t);connectFrom=null;showRadial()}});

/* ---------- pointer handling ---------- */
const pts=new Map();let mode=null,st={},lastTap={t:0,x:0,y:0};
function cardAtPoint(x,y,not){return document.elementsFromPoint(x,y).map(e=>e.closest&&e.closest('.card')).find(e=>e&&e.dataset.id!==not&&!e.classList.contains('gone')&&e.style.display!=='none'&&!e.closest('.sc'))}
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('input,textarea,select,button,a,label')) return;
  hideHand();closeTransient();$('#fire').classList.contains('on')&&0;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.setPointerCapture(e.pointerId);cancelAnimationFrame(anim);
  if(pts.size===2){const [a,b]=[...pts.values()];mode='pinch';st={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k,vx:view.x,vy:view.y,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};return}
  if(pts.size>2)return;
  const dot=e.target.closest('.dot'),cardEl=e.target.closest('.card'),lens=e.target.closest('.lens'),av=e.target.closest('.av');
  lastPt=[e.clientX,e.clientY];
  if(dot&&cardEl){const id=cardEl.dataset.id;if(!guard(fld(byId[id].field))){mode='none';return}mode='link';st={from:id,side:dot.dataset.s};select(id);connectFrom='drag';showRadial();tipOnce('dots','Drop on another card to connect. Drop on empty space to lay a new card there.',cardEl);return}
  if(cardEl){
    const id=cardEl.dataset.id;
    if(connectFrom&&connectFrom!=='drag'&&connectFrom!==id){mode='none';const r=cardEl.getBoundingClientRect();chooser(e.clientX,e.clientY,connectFrom,id);return}
    mode='card';const c=byId[id];st={id,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,moved:false,wasSel:sel===id};
    tipOnce('first','Drag to move it. Tap to open its tools. Double-tap to read it.',cardEl);return}
  if(lens){mode='lens';const f=lens.dataset.lens;st={f,el:lens,sx:e.clientX,sy:e.clientY,ox:parseFloat(lens.style.left),oy:parseFloat(lens.style.top)};lens.classList.add('drag');return}
  if(av){mode='av';st={n:av.dataset.n,f:av.dataset.f,sx:e.clientX,sy:e.clientY};return}
  mode='pan';st={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};
});
vp.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)){lastPt=[e.clientX,e.clientY];return}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});lastPt=[e.clientX,e.clientY];
  if(mode==='pinch'&&pts.size>=2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),k=Math.max(.14,Math.min(2.6,st.k*d/st.d));const wx=(st.cx-st.vx)/st.k,wy=(st.cy-st.vy)/st.k;const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;view.k=k;view.x=cx-wx*k;view.y=cy-wy*k;applyView();return}
  if(mode==='pan'){const dx=e.clientX-st.sx,dy=e.clientY-st.sy;if(!st.moved&&Math.hypot(dx,dy)>4){st.moved=true;vp.classList.add('panning')}if(st.moved){view.x=st.vx+dx;view.y=st.vy+dy;applyView()}return}
  if(mode==='card'){
    const dx=e.clientX-st.sx,dy=e.clientY-st.sy;const c=byId[st.id];
    if(!st.moved&&Math.hypot(dx,dy)>5){if(!isNow(fld(c.field)||{stages:[0],id:'x'})&&c.field in stage&&!isNow(fld(c.field))){mode='none';toast('You are looking at the past. Move the slider to the last stop to move cards.');return}st.moved=true;dragCard=st.id;els[st.id].classList.add('drag');$('#radial').innerHTML=''}
    if(st.moved){c.x=st.ox+dx/view.k;c.y=st.oy+dy/view.k;els[st.id].style.left=c.x+'px';els[st.id].style.top=c.y+'px';drawLinks();
      const over=overShelf(e.clientX,e.clientY);$('#shelf').classList.toggle('over',over)}
    return}
  if(mode==='link'){
    const c=byId[st.from],a=anchor(c,st.side),[wx,wy]=toWorld(e.clientX,e.clientY);
    pv.setAttribute('d',`M${a[0]} ${a[1]}L${wx} ${wy}`);
    $$('.card.target').forEach(x=>x.classList.remove('target'));const t=cardAtPoint(e.clientX,e.clientY,st.from);if(t)t.classList.add('target');return}
  if(mode==='lens'){const dx=(e.clientX-st.sx)/view.k,dy=(e.clientY-st.sy)/view.k;st.el.style.left=st.ox+dx+'px';st.el.style.top=st.oy+dy+'px';
    const q=$(`.qcard[data-q="${st.f}"]`),lr=st.el.getBoundingClientRect(),qr=q.getBoundingClientRect();const hit=!(lr.right<qr.left||lr.left>qr.right||lr.bottom<qr.top||lr.top>qr.bottom);q.classList.toggle('hot',hit);st.hit=hit;return}
});
function endPointer(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(mode==='pinch'){if(pts.size<2){mode=null}return}
  if(mode==='pan'){vp.classList.remove('panning');
    if(!st.moved){
      const now=performance.now(),d=Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y);
      if(now-lastTap.t<360&&d<30){lastTap.t=0;const [wx,wy]=toWorld(e.clientX,e.clientY);const f=fieldAt(wx,wy);if(f.id!=='new'||0)openComposer(wx,wy,{screen:[e.clientX,e.clientY],target:sel})}
      else{lastTap={t:now,x:e.clientX,y:e.clientY};deselect()}
    }}
  if(mode==='card'){
    const c=byId[st.id],el=els[st.id];el.classList.remove('drag');dragCard=null;
    if(st.moved){
      const over=overShelf(e.clientX,e.clientY);$('#shelf').classList.remove('over');
      const nx=c.x,ny=c.y;
      if(over){c.x=st.ox;c.y=st.oy;sync();offer(c.id)}
      else{const ox=st.ox,oy=st.oy,of=c.field;const nf=fieldAt(nx+120,ny+50).id;doMove('You',`moved “${short(c.text)}”`,c.field,()=>{c.x=nx;c.y=ny;c.field=nf},()=>{c.x=ox;c.y=oy;c.field=of})}
      showRadial();
    }else{
      const now=performance.now();
      if(c._tap&&now-c._tap<380){c._tap=0;select(c.id);openDetail(c.id)}
      else{c._tap=now;if(st.wasSel&&0){deselect()}else select(c.id)}
    }}
  if(mode==='link'){
    pv.setAttribute('d','');$$('.card.target').forEach(x=>x.classList.remove('target'));
    const t=cardAtPoint(e.clientX,e.clientY,st.from);connectFrom=null;
    if(t)chooser(e.clientX,e.clientY,st.from,t.dataset.id);
    else{const [wx,wy]=toWorld(e.clientX,e.clientY);const f=fieldAt(wx,wy);if(f.id!=='new')openComposer(wx,wy,{screen:[e.clientX,e.clientY],target:st.from,type:'supports'})}
    showRadial();}
  if(mode==='lens'){const q=$(`.qcard[data-q="${st.f}"]`);q.classList.remove('hot');st.el.classList.remove('drag');
    if(Math.hypot(e.clientX-st.sx,e.clientY-st.sy)<6||st.hit){openModels(st.f)}
    st.el.style.left=st.el.dataset.hx+'px';st.el.style.top=st.el.dataset.hy+'px'}
  if(mode==='av'&&Math.hypot(e.clientX-st.sx,e.clientY-st.sy)<8){openFire()}
  mode=null;
}
vp.addEventListener('pointerup',endPointer);vp.addEventListener('pointercancel',endPointer);
vp.addEventListener('wheel',e=>{e.preventDefault();hideHand();const f=Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016));zoomAt(e.clientX,e.clientY,f)},{passive:false});
world.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='rp'){const fid=b.dataset.f;if(!guard(fld(fid)))return;setRP(fid,!(rp[fid]&&rp[fid].on))}
  if(a==='rnext')nextRound(b.dataset.f);
  if(a==='jump'){flyField('map');setTimeout(()=>{select(foc.id)},700)}

world.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('.card');if(c){select(c.dataset.id);openDetail(c.dataset.id)}const a=e.target.closest('.av');if(a)openFire()}});

/* ---------- hand (first contact) ---------- */
let handT=null;
function showHand(){
  const c=k2,e=els[c.id];if(!e||hs.done)return;hs.done=1;
  const r=e.getBoundingClientRect(),h=$('#hand'),cap=$('#handcap');
  const sx=r.left+r.width*.5,sy=r.top+r.height*.55;
  h.style.display='block';cap.style.display='block';cap.textContent='Grab a card. Everything happens on the card.';
  cap.style.left=Math.max(10,Math.min(innerWidth-300,sx-110))+'px';cap.style.top=(sy+54)+'px';
  if(reduce){h.style.left=sx+'px';h.style.top=sy+'px';return}
  const t0=performance.now();
  const step=t=>{const p=((t-t0)%2800)/2800,q=p<.15?0:p<.65?(p-.15)/.5:1,ee=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;h.style.left=(sx+ee*70)+'px';h.style.top=(sy+ee*34)+'px';h.style.transform=`scale(${p>.15&&p<.65?.9:1})`;handT=requestAnimationFrame(step)};
  handT=requestAnimationFrame(step);setTimeout(hideHand,9000);
}
function hideHand(){cancelAnimationFrame(handT);$('#hand').style.display='none';$('#handcap').style.display='none'}

/* ---------- overlays: time, rules ---------- */
let pinT=false,pinR=false;
function renderTime(){
  const f=cur(),o=$('#timeov');
  if(!f||!f.stages){o.innerHTML=`<h3>Time</h3><p class="sub">This field has only today so far.</p>`;return}
  const s=stage[f.id],n=f.stages.length;
  const tk=f.stages.map((l,i)=>`<span class="${i===s?'on':''}" style="${n>6&&i%3&&i!==s?'visibility:hidden':''}">${esc(l)}</span>`).join('');
  o.innerHTML=`<h3>${esc(f.name)} on a date</h3><p class="sub">Drag to see the board as it stood then. Later cards fade out${f.id==='gold'?' and the line stops at the date':''}.</p>
  <input id="tr" type="range" min="0" max="${n-1}" step="1" value="${s}" aria-label="Date">
  <div class="ticks">${tk}</div>
  <div class="tcap"><b>${esc(f.stages[s])}</b>${s<n-1?`<span style="color:var(--mut)">Read only. Cards laid later are hidden.</span><button class="sb" id="trNow">Back to today</button>`:'<span style="color:var(--mut)">Now. You can change the board.</span>'}</div>`;
}
$('#timeov').addEventListener('input',e=>{if(e.target.id==='tr'){stage[cur().id]=+e.target.value;sync();renderTime();renderFire()}});
$('#timeov').addEventListener('click',e=>{if(e.target.id==='trNow'){stage[cur().id]=maxStage(cur());sync();renderTime()}});
const RS={yes:['applies','✓'],no:['does not apply','×'],unc:['unclear','?'],pre:['starting premise','•']};
function renderRules(){
  const f=cur(),o=$('#rulesov');
  if(!f||!f.rules){o.innerHTML=`<h3>Which of your rules apply</h3><p class="sub">Your rules, your call.</p><p style="font-size:13.5px">No rules yet in this field. Add the first one below.</p><div class="addrule"><input id="newrule" placeholder="Write a rule" aria-label="New rule"><button class="sb" id="addr">Add</button></div>`;return}
  o.innerHTML=`<h3>Which of your rules apply</h3><p class="sub">These are your rules. The board does not judge. You decide what’s true.</p>
  ${f.rules.map((r,i)=>`<button class="rule ${r[1]}" data-i="${i}"><span class="gl">${RS[r[1]][1]}</span>${esc(r[0])}<span class="st">${RS[r[1]][0]}</span></button>`).join('')}
  <div class="addrule"><input id="newrule" placeholder="Add a rule" aria-label="New rule"><button class="sb" id="addr">Add</button></div>
  ${f.origins?`<div class="orig"><b>${esc(f.origins.text)}</b><div class="row">${f.origins.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div><p style="margin:8px 0 0;color:var(--mut);font-size:12.5px">Copies of one source count once under your first rule.</p></div>`:''}`;
}
$('#rulesov').addEventListener('click',e=>{
  const f=cur();const r=e.target.closest('.rule');
  if(r){const i=+r.dataset.i,it=f.rules[i];if(it[1]==='pre')return;it[1]={yes:'no',no:'unc',unc:'yes'}[it[1]];renderRules();return}
  if(e.target.id==='addr'){const v=$('#newrule').value.trim();if(!v)return;f.rules=f.rules||[];f.rules.push([v,'unc']);renderRules()}
});
function setOv(which,on,pin){
  const o=which==='t'?$('#timeov'):$('#rulesov');o.classList.toggle('on',on);
  if(which==='t')pinT=on&&pin;else pinR=on&&pin;
  if(on){which==='t'?renderTime():renderRules()}
}
['#gripT','#gripL'].forEach((g,i)=>{const w=i?'r':'t',o=i?$('#rulesov'):$('#timeov');
  $(g).addEventListener('click',()=>setOv(w,!o.classList.contains('on')||!(w==='t'?pinT:pinR),true)&&0);
  $(g).addEventListener('click',()=>{const on=o.classList.contains('on');if(!on)setOv(w,true,true);else if(!(w==='t'?pinT:pinR)){if(w==='t')pinT=true;else pinR=true}else setOv(w,false)});
  $(g).addEventListener('pointerenter',ev=>{if(ev.pointerType==='mouse'&&!o.classList.contains('on'))setOv(w,true,false)});

$('#gripT').replaceWith($('#gripT').cloneNode(true));$('#gripL').replaceWith($('#gripL').cloneNode(true));

  const ag=(v.match(/\b(A[123])\b/)||[])[1]||((f.players.find(p=>/^A/.test(p.n))||{}).n);
  const s=sel&&byId[sel]?`Starting from “${short(byId[sel].text)}”. `:'';
  setTimeout(()=>say(f.id,ag,s+'I found nothing new to lay yet. Tell me which card to start from, or pick a suggestion below.'),500)});
function chip(k){
  const f=cur();if(!f)return;const me=f.id==='map'?'K':'You';
  const label=(f.chips.find(c=>c[0]===k)||[0,''])[1];
  if(k==='rp'){say(f.id,me,'Start a role play.');if(guard(f))setRP(f.id,!(rp[f.id]&&rp[f.id].on));return}
  say(f.id,me,label);
  setTimeout(()=>{
    if(k==='origins')say('claim','A2','Six of the supporting cards go back to the 76 patients in Córdoba. Under your first rule they count once.');
    if(k==='larger')say('claim','A1','The registry lists 517 patients and no results yet. Nothing to lay.');
    if(k==='china')say('map','A3','Playing China: I offer mediation first, and I keep a blockade off the table. It is my red line.');
    if(k==='challenge')say('gold','A2','“Analyst: 5000 by summer” is Said, one analyst. Under your rule, one analyst is not a trend. I laid nothing.');
    if(k==='hormuz'){say('gold','A1','Opening the Map.');flyField('map');setTimeout(()=>select(foc.id),700)}
    if(k==='stage2'){say('map','A1','Laying two cards.');
      const m=fld('map');if(!guard(m))return;
      const a=addCardMove(m,m.x+340,m.y+250,{text:'Insurers: war-risk cover is repriced per voyage.',layer:'said',src:'Shipping insurer notes',by:'A1'},foc.id,'supports','A1');
      const b=addCardMove(m,m.x+340,m.y+560,{text:'Alternative routes: pipelines to Fujairah and Yanbu.',layer:'said',src:'Energy analyst briefing',by:'A1'},foc.id,'refutes','A1');
      say('map','A1','Done: 2 cards laid, linked to your assumption. I did not touch it.')}
  },450);

  const tabs=`<div class="tabs"><button data-k="member" aria-pressed="${sheetKind==='member'}">Membership</button><button data-k="community" aria-pressed="${sheetKind==='community'}">Community</button></div>`;
  const mine=cards.filter(c=>!c.hidden&&isMe(c.by)&&c.src).length;
  if(sheetKind==='member'){
    const deck=cards.filter(c=>c.taken&&!c.hidden),st_=stances();
    s.innerHTML=`<button class="x" data-close="1" aria-label="Close">×</button><h3>Member #1 Kane</h3><div class="sub">Your standing comes from cards that carry a source, from cards others take, and from being the origin of a card.</div>${tabs}
    <div class="stats"><div><b>${mine}</b>cards with a source</div><div><b>${5+deck.filter(c=>c.fromShelf).length*0}</b>takes by others</div><div><b>${9+mine}</b>origin points</div></div>
    <div class="plan on"><b>Board: free</b><br>Three fields and your own fields, with your agents.</div>
    <div class="plan on"><b>Exchange: optional</b><br>Offer and take cards. The origin always stays with the author. Switch it off any time.</div>
    <div class="plan"><b>Premium: Private Executive</b><br>Comes ready-made. Everything private runs on your own machine.</div>
    <h3 style="font-size:16px;margin:14px 0 4px">My deck (${deck.length})</h3>${deck.length?deck.map(c=>`<div class="mrow"><span class="nb">${esc((c.by||'').replace('#','').slice(0,2))}</span><span>${esc(short(c.text))}<small>by ${esc(c.by)}${c.via?', via '+esc(c.via):''}</small></span></div>`).join(''):'<p style="font-size:13.5px;color:var(--mut);margin:0">Empty. Select a card by someone else and use Take.</p>'}
    <h3 style="font-size:16px;margin:14px 0 4px">My stances (${st_.length}), private</h3>${st_.length?st_.map(c=>`<div class="mrow"><span class="nb" style="background:none;color:var(--ink);font-size:18px">★</span><span>${esc(short(c.text))}<small>${esc(fld(c.field).name)}</small></span></div>`).join(''):'<p style="font-size:13.5px;color:var(--mut)">None set.</p>'}`;
  }else{
    const traded=cards.filter(c=>!c.hidden&&(c.taken||c.via));
    s.innerHTML=`<button class="x" data-close="1" aria-label="Close">×</button><h3>Community</h3><div class="sub">Other members, their boards, and a shared wiki that grows from traded cards.</div>${tabs}
    ${[['#1','Kane (you)','Boards: Vitamin D, Hormuz, Gold'],['#2','Chris','Board: Vitamin D for my family'],['#3','Ines','Board: Gold in the household budget'],['#4','Tomás','Board: Shipping through the Gulf']].map(m=>`<div class="mrow"><span class="nb">${m[0]}</span><span><b>${m[1]}</b><small>${m[2]}</small></span>${m[0]==='#1'?'':`<button class="sb" style="margin-left:auto" data-visit="${m[1]}">Visit</button>`}</div>`).join('')}
    <h3 style="font-size:16px;margin:14px 0 4px">Shared wiki</h3><p class="sub" style="margin:0 0 6px">Every traded card, with its author.</p>
    ${traded.length?traded.map(c=>`<div class="mrow"><span class="nb">${esc((c.by||'').replace('#','').slice(0,2))}</span><span>${esc(short(c.text))}<small>${esc(LN[c.layer])} by ${esc(c.by)} in ${esc(fld(c.field).name)}</small></span></div>`).join(''):'<p style="font-size:13.5px;color:var(--mut)">Nothing traded yet. Open the exchange and take a card.</p>'}`;
  }
}
$('#sheet').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeSheets();return}
  const t=e.target.closest('.tabs button');if(t){sheetKind=t.dataset.k;refreshSheet();return}
  const v=e.target.closest('[data-visit]');if(v){toast('Sample board: '+v.dataset.visit+'’s board opens here.');return}
  const l=e.target.closest('[data-lay]');if(l){const f=cur(),a=models_(f)[+l.dataset.lay];if(!guard(f))return;const p=freeSpot(f);addCardMove(f,p[0],p[1]+40,{text:a,layer:'model',src:'Model '+(+l.dataset.lay+1)+' answer',by:'Model '+(+l.dataset.lay+1)},null,null,'You');closeSheets()}
});
const models_=f=>f.models||[];
function openModels(fid){
  const f=fld(fid);curModel=f;closeSheets('sheet');sheetKind='models';const s=$('#sheet');s.classList.add('on');
  s.innerHTML=`<button class="x" data-close="1" aria-label="Close">×</button><h3>5 AI models say</h3><div class="sub">Asked: “${esc(f.q)}”</div><div class="note">Their own layer. This is not a verdict of the board. You decide what’s true.</div>
  ${f.models.map((m,i)=>`<div class="ma"><b>Model ${i+1}</b>${esc(m)}<br><button class="btn" data-lay="${i}">Lay as a card</button></div>`).join('')}`;
}
let curModel=null;
/* shelf */
function renderShelf(){
  const s=$('#shelf');
  const vis=shelf.filter(x=>!x.gone);
  s.innerHTML=`<button class="x" data-close="1" aria-label="Close">×</button><h3>Exchange</h3><div class="sub">Drag a card from here onto the board to take it. Drag one of yours here to offer it. The origin stays with its author.</div>
  ${vis.map(x=>`<div class="sc" data-sid="${x.sid}"><div class="card ${x.layer}" style="position:relative"><div class="tag">${svg(LG[x.layer])}${LN[x.layer]}</div><div class="txt">${esc(x.text)}</div></div><div class="by"><span>${x.mine?'Offered by you':'Offered by '+esc(x.by)}</span><button class="btn" data-take="${x.sid}">${x.mine?'Withdraw':'Take'}</button></div></div>`).join('')||'<p style="font-size:13.5px;color:var(--mut)">Nothing on offer right now.</p>'}`;
}
function openShelf(){closeSheets('shelf');renderShelf();$('#shelf').classList.add('on');$('#bShelf').setAttribute('aria-pressed','true');tipOnce('shelf','Like a book swap: you take a copy, the author keeps the credit.',$('#shelf'))}
$('#shelf').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeSheets();return}
  const t=e.target.closest('[data-take]');if(t){const x=shelf.find(s=>s.sid===t.dataset.take);if(x.mine){const m=moves.slice().reverse().find(m=>m.text.includes('offered')&&!m.undone);x.gone=true;renderShelf();toast('Withdrawn.')}else takeFromShelf(t.dataset.take)}});
let sdrag=null;
$('#shelf').addEventListener('pointerdown',e=>{
  const sc=e.target.closest('.sc');if(!sc||e.target.closest('button'))return;e.preventDefault();
  const g=sc.cloneNode(true);g.classList.add('ghost');g.style.left=e.clientX-100+'px';g.style.top=e.clientY-30+'px';document.body.appendChild(g);
  sdrag={sid:sc.dataset.sid,g};
  const mv=ev=>{g.style.left=ev.clientX-100+'px';g.style.top=ev.clientY-30+'px'};
  const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);g.remove();
    const over=overShelf(ev.clientX,ev.clientY);if(!over){const [wx,wy]=toWorld(ev.clientX,ev.clientY);const x=shelf.find(s=>s.sid===sdrag.sid);if(x&&x.mine){x.gone=true;renderShelf();toast('Withdrawn.')}else takeFromShelf(sdrag.sid,wx-120,wy-40)}sdrag=null};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
});
function overShelf(x,y){const s=$('#shelf');if(!s.classList.contains('on'))return false;const r=s.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
$('#bShelf').onclick=()=>$('#shelf').classList.contains('on')?closeSheets():openShelf();

/* ---------- palette ---------- */
let pItems=[],pSel=0;
function openPalette(q=''){closeTransient();$('#palette').classList.add('on');const i=$('#pin');i.value=q;renderPalette();setTimeout(()=>i.focus(),10)}
function closePalette(){$('#palette').classList.remove('on')}
function cmds(){const f=cur();return[
 ['Go to Claim: Vitamin D','go',()=>flyField('claim')],['Go to Map: Hormuz','go',()=>flyField('map')],['Go to Market: Gold','go',()=>flyField('gold')],['New field','build',()=>{flyField('new');}],
 ['Lay a card here','',()=>{const [x,y]=lastPt?toWorld(lastPt[0],lastPt[1]):toWorld(innerWidth/2,innerHeight/2);openComposer(x,y,{screen:lastPt||[innerWidth/2,innerHeight/2]})}],
 ['5 AI models say','',()=>f&&f.models?openModels(f.id):toast('Add a question to this field to ask five models.')],
 ['Open the exchange','trade',()=>openShelf()],['Your rules','',()=>setOv('r',true,true)],['Time slider','',()=>setOv('t',true,true)],
 ['Role play on or off','',()=>{if(f&&f.script&&guard(f))setRP(f.id,!(rp[f.id]&&rp[f.id].on))}],['Open fireside','',()=>openFire()],
 ['Membership','',()=>openSheet('member')],['Community','',()=>openSheet('community')],['Take back last move','',()=>undoLast()],['Switch light or dark','',()=>cycleTheme()]]}
function renderPalette(){
  const q=$('#pin').value.trim().toLowerCase(),ws=q.split(/\s+/).filter(Boolean);
  const m=s=>ws.every(w=>s.toLowerCase().includes(w));
  const ks=KNOW.filter(k=>m(k.text+' '+k.src+' '+fld(k.f).name)).slice(0,6),cs=cmds().filter(c=>m(c[0])).slice(0,q?5:9);
  pItems=[...ks.map(k=>({t:'k',k})),...cs.map(c=>({t:'c',c}))];pSel=0;
  const kh=ks.length?`<div class="pg">Knowledge cards. Enter lands one under your pointer.</div>`+ks.map((k,i)=>`<button class="pi" data-i="${i}"><span class="tag" style="color:var(--${k.layer==='exp'?'exp':k.layer==='proven'?'proven':'said'})">${svg(LG[k.layer])}</span>${esc(k.text)}<small>${esc(fld(k.f).name)}</small></button>`).join(''):'';
  const ch=cs.length?`<div class="pg">Commands</div>`+cs.map((c,i)=>`<button class="pi" data-i="${ks.length+i}">${esc(c[0])}</button>`).join(''):'';
  $('#plist').innerHTML=kh+ch||'<div class="pg">Nothing found. Try a shorter word.</div>';
  markSel();
}
function markSel(){$$('#plist .pi').forEach(b=>b.classList.toggle('sel',+b.dataset.i===pSel))}
function runPalette(i){const it=pItems[i];if(!it)return;closePalette();
  if(it.t==='k'){const at=lastPt?toWorld(lastPt[0],lastPt[1]):toWorld(innerWidth/2,innerHeight/2);const f=fieldAt(at[0],at[1]);if(f.id!==it.k.f&&0){}pingCard(it.k,at)}else it.c[2]()}
$('#pin').addEventListener('input',renderPalette);
$('#pin').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){pSel=Math.min(pItems.length-1,pSel+1);markSel();e.preventDefault()}if(e.key==='ArrowUp'){pSel=Math.max(0,pSel-1);markSel();e.preventDefault()}if(e.key==='Enter')runPalette(pSel);if(e.key==='Escape')closePalette()});
$('#plist').addEventListener('click',e=>{const b=e.target.closest('.pi');if(b)runPalette(+b.dataset.i)});
$('#palette').addEventListener('pointerdown',e=>{if(e.target.id==='palette')closePalette()});
$('#bSearch').onclick=()=>openPalette();

/* ---------- menu & theme ---------- */
function cycleTheme(){theme={auto:'dark',dark:'light',light:'auto'}[theme];if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=theme;renderMenu();setTimeout(()=>{sync();updateMini()},50);toast('Theme: '+theme)}
function renderMenu(){
  const mine=cards.filter(c=>!c.hidden&&isMe(c.by)&&c.src).length;
  $('#menu').innerHTML=`<div class="who"><b>Kane</b><span>Member #1, standing: ${mine} cards with a source</span></div>
  <button class="mi" data-m="member">${svg('<circle cx="12" cy="8" r="3.500"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>')}Membership<em>#1</em></button>
  <button class="mi" data-m="community">${svg('<circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.500"/><path d="M2 19c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1 7 4"/>')}Community<em>4 members</em></button>
  <button class="mi" data-m="shelf">${svg(IC.trade)}Exchange<em>${shelf.filter(s=>!s.gone&&!s.mine).length} on offer</em></button>
  <button class="mi" data-m="rules">${svg('<path d="M5 6h14M5 12h14M5 18h9"/>')}Your rules<em>Space</em></button>
  <button class="mi" data-m="theme">${svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.500 5.500l1.500 1.500M17 17l1.500 1.500M18.500 5.500L17 7M7 17l-1.500 1.500"/>')}Light or dark<em>${theme}</em></button>
  <button class="mi" data-m="hints">${svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11v5"/>')}Show hints again</button>`;
}
$('#meBtn').onclick=e=>{e.stopPropagation();const on=!$('#menu').classList.contains('on');closeTransient();if(on){renderMenu();$('#menu').classList.add('on');$('#meBtn').setAttribute('aria-expanded','true')}};
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const k=b.dataset.m;$('#menu').classList.remove('on');
  if(k==='member'||k==='community')openSheet(k);if(k==='shelf')openShelf();if(k==='rules')setOv('r',true,true);if(k==='theme')cycleTheme();if(k==='hints'){hints.clear();hs.done=0;showHand();toast('Hints are back.')}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#me'))$('#menu').classList.remove('on')});
$('#bNew').onclick=()=>flyField('new');

/* ---------- builder ---------- */
const BASES=[['debate','Debate','Two sides argue one statement',['Supports','Refutes']],['map','Map','Players with a focal point in the middle',['Actors','Evidence']],['market','Market','Price on top, board below',['Demand','Supply','Macro']],['blank','Blank board','Start from nothing',['Zone 1']]];
const B={base:'debate',zones:['Supports','Refutes'],seats:[{name:'You',mover:'human'},{name:'A1',mover:'agent'}],name:'My field'};
function renderBuilder(){
  const el=$('#bld');if(!el)return;
  el.innerHTML=`<div class="col"><h5>1 Base</h5><p class="hint">What is the ground like?</p>${BASES.map(b=>`<button class="base" data-base="${b[0]}" aria-pressed="${B.base===b[0]}"><b>${b[1]}</b><small>${b[2]}</small></button>`).join('')}</div>
  <div class="col"><h5>2 Zones</h5><p class="hint">The regions cards live in.</p>${B.zones.map((z,i)=>`<div class="zr"><input type="text" value="${esc(z)}" data-z="${i}" aria-label="Zone name"><button class="rm" data-rz="${i}" aria-label="Remove zone">×</button></div>`).join('')}<button class="sb" data-addz="1">+ Zone</button></div>
  <div class="col"><h5>3 Seats</h5><p class="hint">Who plays, and who makes the moves.</p>${B.seats.map((s,i)=>`<div class="sr"><input type="text" value="${esc(s.name)}" data-s="${i}" aria-label="Seat name"><div class="seg">${['human','agent','model'].map(m=>`<button data-sm="${i}:${m}" aria-pressed="${s.mover===m}">${m}</button>`).join('')}</div><button class="rm" data-rs="${i}" aria-label="Remove seat">×</button></div>`).join('')}<button class="sb" data-adds="1">+ Seat</button></div>
  <div class="foot"><input type="text" id="bname" value="${esc(B.name)}" aria-label="Field name"><button class="btn pri" id="bgo">Create field</button></div>`;
}
world.addEventListener('click',e=>{
  if(!e.target.closest('#newz'))return;const t=e.target;
  const base=t.closest('[data-base]');if(base){const b=BASES.find(x=>x[0]===base.dataset.base);B.base=b[0];B.zones=[...b[3]];renderBuilder();return}
  if(t.dataset.addz){B.zones.push('Zone '+(B.zones.length+1));renderBuilder();return}
  const rz=t.closest('[data-rz]');if(rz){if(B.zones.length>1){B.zones.splice(+rz.dataset.rz,1);renderBuilder()}return}
  if(t.dataset.adds){B.seats.push({name:'A'+(B.seats.length),mover:'agent'});renderBuilder();return}
  const rs=t.closest('[data-rs]');if(rs){if(B.seats.length>1){B.seats.splice(+rs.dataset.rs,1);renderBuilder()}return}
  const sm=t.closest('[data-sm]');if(sm){const [i,m]=sm.dataset.sm.split(':');B.seats[+i].mover=m;renderBuilder();return}
  if(t.id==='bgo')createField();
});
world.addEventListener('input',e=>{const t=e.target;if(!t.closest('#newz'))return;if(t.dataset.z!=null)B.zones[+t.dataset.z]=t.value;if(t.dataset.s!=null)B.seats[+t.dataset.s].name=t.value;if(t.id==='bname')B.name=t.value});
function createField(){
  const name=(B.name||'').trim()||'My field';
  const n=++customCount,w=Math.max(1100,380*B.zones.length+60),h=620;
  const f={id:'u'+n,name,kind:'custom',x:NEWF.x,y:NEWF.y,w,h,kicker:'Your field',title:name,blurb:`Built on a ${BASES.find(b=>b[0]===B.base)[1].toLowerCase()} base with ${B.zones.length} zone${B.zones.length>1?'s':''} and ${B.seats.length} seat${B.seats.length>1?'s':''}.`,
    zones:[...B.zones],seats:B.seats.map(s=>({...s})),stages:['Today'],players:[],rules:[],chips:[['hello','Ask the agents to start']]};
  let ax=0;B.seats.forEach(s=>{if(s.mover!=='human'){f.players.push({n:s.name.slice(0,3),role:s.mover,c:['--a1','--a2','--a3'][ax++%3],x:140+ax*260,y:70,model:s.mover==='model'})}});
  const first=f.players[0];f.fire=[...(first?[[first.n,`This field is ready. Zones: ${f.zones.join(', ')}. Lay the first card, or tell me where to start.`]]:[])];
  fire[f.id]=f.fire.map(([w,t])=>({w,t}));stage[f.id]=0;
  F.push(f);NEWF.x+=w+300;const z=fieldMarkup(f);world.insertBefore(z,$('#links'));f.players.forEach(p=>mkAv(f,p));updateBubbles();
  $('#newz').style.left=NEWF.x+'px';
  moves.push({id:++mid,who:'You',text:`built the field “${name}”`,field:f.id,undone:false,do(){z.style.display='';f.players.length},undo(){z.style.display='none'}});
  renderLog();updateMini();flyField(f.id);toast('Field created. Double-click a zone to lay a card.');
  B.name='My field';renderBuilder();
}

/* ---------- misc wiring ---------- */
function refreshField(){renderLog();updateMini();if($('#timeov').classList.contains('on'))renderTime();if($('#rulesov').classList.contains('on'))renderRules();renderFire();$$('.zone').forEach(z=>z.classList.toggle('cur',z.dataset.f===curId))}
addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').classList.contains('on')?closePalette():openPalette();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();if(guard(cur()))undoLast();return}
  if(e.key==='Escape'){closePalette();closeTransient();deselect();$('#timeov').classList.remove('on');$('#rulesov').classList.remove('on');pinT=pinR=false;closeSheets();return}
  if(typing)return;
  if(e.key===' '){e.preventDefault();const on=$('#timeov').classList.contains('on')||$('#rulesov').classList.contains('on');if(on){$('#timeov').classList.remove('on');$('#rulesov').classList.remove('on');pinT=pinR=false}else{setOv('t',true,true);setOv('r',true,true)}}
  if(e.key==='+'||e.key==='=')zoomAt(innerWidth/2,innerHeight/2,1.2);if(e.key==='-')zoomAt(innerWidth/2,innerHeight/2,1/1.2);
  const step=80;if(e.key==='ArrowLeft'){view.x+=step;applyView()}if(e.key==='ArrowRight'){view.x-=step;applyView()}if(e.key==='ArrowUp'){view.y+=step;applyView()}if(e.key==='ArrowDown'){view.y-=step;applyView()}
});
addEventListener('resize',()=>{applyView();drawCharts()});

/* ---------- init ---------- */
buildWorld();sync();updateBubbles();renderMenu();renderLog();
const v0=fitView(fld('claim'));Object.assign(view,v0);applyView();
setTimeout(()=>{sync();showHand()},500);
document.fonts&&document.fonts.ready.then(()=>{sync()});
window.__rr={flyField,select,openDetail,openPalette,openShelf,openModels,openFire,setOv,view,byId,cards,links,moves,stage,openSheet,F,setRP,nextRound,chip,toWorld,openComposer,sync,hideHand,cycleTheme};
})();
